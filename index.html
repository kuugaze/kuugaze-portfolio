<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuugaze</title>
<style>
  :root{
    --bg:#f4f4f2;
    --card-bg:#ffffff;
    --ink:#1a1a1a;
    --sub:#6b6b6b;
    --line:#e2e2df;
    --accent:#2b3fff;
    --modal-sub:var(--sub);
    --modal-line:var(--line);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141416;
      --card-bg:#1d1d20;
      --ink:#f2f2f0;
      --sub:#9c9c9c;
      --line:#2c2c2f;
      --accent:#7c8aff;
      --modal-sub:#eaeaea;
      --modal-line:rgba(255,255,255,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141416;
    --card-bg:#1d1d20;
    --ink:#f2f2f0;
    --sub:#9c9c9c;
    --line:#2c2c2f;
    --accent:#7c8aff;
    --modal-sub:#eaeaea;
    --modal-line:rgba(255,255,255,.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  }
  a{color:inherit;text-decoration:none;}

  .banner{
    width:100%;
    height:var(--banner-height, 190px);
    background-image:url("images/banner.png");
    background-size:cover;
    background-position:center;
  }

  .wrap{
    max-width:var(--site-width, 1240px);
    margin:0 auto;
    padding:28px 28px 80px;
  }

  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:40px;
    align-items:start;
  }

  .profile{
    padding-top:0;
    position:sticky;
    top:24px;
  }
  .avatar{
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    margin-top:-52px;
    border:4px solid var(--bg);
    display:block;
    background:var(--card-bg);
  }
  .profile h1{
    font-size:20px;
    margin:14px 0 4px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .profile .role{
    font-size:13px;
    color:var(--sub);
    margin:0 0 6px;
    line-height:1.5;
  }
  .profile .loc{
    font-size:12px;
    color:var(--sub);
    margin:0 0 16px;
  }
  .socials{
    display:flex;
    flex-direction:column;
    gap:8px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .socials a{
    font-size:12px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:6px;
    transition:color .15s ease;
  }
  .socials a:hover{ color:var(--accent); }
  .socials svg{ width:14px; height:14px; fill:currentColor; }

  .grid{
    display:grid;
    grid-template-columns:repeat(var(--grid-columns, 4),1fr);
    gap:var(--grid-gap-y, 20px) var(--grid-gap-x, 16px);
  }
  .card{
    display:block;
    cursor:pointer;
    /* Grid items default to min-width:auto, so a card whose caption text
       can't break anywhere would otherwise force its whole column wider
       than its fair share -- most visible with more, narrower columns.
       min-width:0 lets every column share the row equally as intended. */
    min-width:0;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    background:var(--card-bg);
    border:1px solid var(--line);
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .35s ease, opacity .35s ease;
  }
  .card:hover .thumb img{
    transform:scale(1.04);
    opacity:.92;
  }
  .caption{
    margin-top:9px;
    line-height:1.45;
  }
  /* Higher specificity than .about-card .caption's visibility:hidden (kept
     below, to reserve the about-card's height so it still matches other
     cards) so that toggling captions off shrinks every card -- about-card
     included -- by the same amount instead of leaving it visibly taller. */
  html.hide-captions .caption{ display:none; }
  .cap-label{
    display:block;
    font-size:var(--caption-label-size, 11px);
    font-weight:var(--caption-label-weight, 500);
    color:var(--caption-label-color, var(--sub));
    font-family:var(--caption-label-font, inherit);
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .cap-title{
    display:block;
    font-size:var(--caption-title-size, 13px);
    font-weight:var(--caption-title-weight, 700);
    color:var(--caption-title-color, var(--ink));
    font-family:var(--caption-title-font, inherit);
  }

  .about-card .thumb{
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--about-thumb-color, var(--accent));
    background:var(--card-bg);
  }
  .about-card .thumb span{
    font-style:italic;
    font-size:19px;
    color:var(--about-thumb-color, var(--accent));
  }
  .about-card .caption{ visibility:hidden; }

  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
    .profile{ position:static; }
    .avatar{ margin-top:-40px; }
    /* Mobile always shows a fixed 2-column grid with its original gap,
       regardless of the desktop-only column-count/gap sliders below. */
    .grid{ grid-template-columns:repeat(2,1fr); gap:20px 16px; }
    .socials{ flex-direction:row; flex-wrap:wrap; gap:20px; }
    .socials a{ padding:6px 0; }
  }
  @media (max-width:420px){
    .grid{ grid-template-columns:repeat(2,1fr); gap:14px 10px; }
    .wrap{ padding:0 16px 60px; }
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:flex; justify-content:center;
    padding:56px 20px;
    overflow-y:auto;
    overscroll-behavior:contain;
    z-index:50;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--card-bg);
    color:var(--ink);
    max-width:720px;
    width:100%;
    height:fit-content;
    border-radius:8px;
    padding:40px 44px 48px;
    position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .modal-close-btn{
    position:absolute;
    top:14px; right:14px;
    width:32px; height:32px;
    border-radius:6px;
    border:none;
    background:var(--line);
    color:var(--ink);
    font-size:20px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:2;
  }
  .modal-close-btn:hover{ opacity:.8; }
  .proj-subtitle{
    font-style:italic;
    font-weight:700;
    color:var(--accent);
    font-size:22px;
    line-height:1.4;
    margin:0 0 18px;
    padding-right:40px;
    white-space:pre-wrap;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .proj-heading2{
    font-style:italic;
    font-weight:700;
    color:var(--accent);
    font-size:16px;
    margin:26px 0 12px;
  }
  .proj-text{
    font-size:13px;
    line-height:1.9;
    color:var(--ink);
    white-space:pre-wrap;
    margin:0 0 6px;
  }
  .proj-text strong{ font-weight:700; }
  .proj-text a{ color:var(--accent); text-decoration:underline; word-break:break-all; }
  .proj-divider{
    border:none;
    border-top:1px dashed var(--modal-line);
    margin:20px 0;
  }
  .proj-meta{
    font-size:12px;
    line-height:1.9;
    color:var(--modal-sub);
    white-space:pre-wrap;
    margin:0 0 6px;
  }
  .proj-note{
    font-size:11.5px;
    line-height:1.8;
    color:var(--modal-sub);
    white-space:pre-wrap;
    margin:18px 0 0;
  }
  .proj-embed{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:16/9;
    margin:22px 0 0;
    border-radius:4px;
    overflow:hidden;
    background:#000;
  }
  .proj-embed iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .proj-gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin:22px 0 0;
  }
  .proj-gallery img{
    width:100%;
    display:block;
    border-radius:2px;
  }
  .proj-gallery-single{
    grid-template-columns:1fr;
  }
  @media (max-width:600px){
    .modal-overlay{ padding:48px 32px; }
    .modal{ padding:20px 20px 36px; }
    .modal-close-btn{ position:fixed; top:14px; right:14px; z-index:60; }
    .proj-subtitle{ font-size:19px; padding-right:44px; }
    .proj-gallery{ grid-template-columns:1fr; }
  }

  .admin-mode .card:not(.about-card){
    cursor:grab;  }
  .admin-mode .card:not(.about-card):active{
    cursor:grabbing;
  }
  .card.dragging{
    opacity:.35;
  }
  .card.drag-over{
    outline:2px dashed var(--accent);
    outline-offset:4px;
    border-radius:4px;
  }
  #adminPanel{
    position:fixed;
    right:16px; bottom:16px;
    z-index:200;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 12px 32px rgba(0,0,0,.3);
    width:250px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:12px;
    color:var(--ink);
  }
  #adminPanel .admin-title{
    font-weight:700;
    font-size:13px;
  }
  #adminPanel .admin-desc{
    color:var(--sub);
    line-height:1.6;
  }
  #adminPanel .admin-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:4px 0;
  }
  #adminPanel input,
  #adminPanel textarea{
    font-size:12px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    width:100%;
    font-family:inherit;
  }
  #adminPanel textarea{ resize:vertical; }
  #adminPanel button{
    font-size:12px;
    font-weight:700;
    padding:8px 9px;
    border:none;
    border-radius:5px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  #adminPanel button:disabled{
    opacity:.5;
    cursor:default;
  }
  #adminStatus, #adminAddStatus{
    color:var(--sub);
    min-height:14px;
    line-height:1.5;
  }
  /* When there's no status message yet, don't reserve any space for it --
     otherwise it sits as a permanent empty gap between the buttons above
     and below it. */
  #adminStatus:empty, #adminAddStatus:empty{ display:none; }
  #siteSettingsPanel{
    position:fixed;
    left:16px; bottom:16px;
    z-index:200;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 12px 32px rgba(0,0,0,.3);
    width:250px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
    gap:2px;
    font-size:12px;
    color:var(--ink);
  }
  #siteSettingsPanel .admin-title{
    font-weight:700;
    font-size:13px;
  }
  #siteSettingsPanel .admin-desc{
    color:var(--sub);
    line-height:1.6;
    margin-bottom:8px;
  }
  #siteSettingsPanel input[type="file"]{
    font-size:11px;
    width:100%;
  }
  .file-input-visually-hidden{
    position:absolute;
    width:1px;
    height:1px;
    padding:0;
    margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }
  /* ".we-field label{color:var(--sub)}" below outranks a bare
     ".file-choose-btn" (both are one-class selectors, but this button is
     itself a <label>, so that rule's extra type selector gives it higher
     specificity and wins regardless of source order) -- "label.file-
     choose-btn" ties it, so add ".we-field" too to win outright. */
  .we-field label.file-choose-btn{
    /* Fixed white/flat regardless of light-or-dark theme, so every
       "ファイルを選択" button in the admin panel looks identical. */
    display:inline-block;
    font-size:11px;
    padding:6px 10px;
    border:1px solid #dcdcdc;
    border-radius:4px;
    cursor:pointer;
    color:#1a1a1a;
    background:#ffffff;
  }
  .we-field label.file-choose-btn:hover{
    background:#f2f2f2;
  }
  .drop-hint{
    font-size:11px;
    color:var(--sub);
    margin-left:8px;
  }
  .we-field.drag-over{
    outline:2px dashed var(--accent);
    outline-offset:6px;
    border-radius:6px;
  }
  #siteSettingsPanel input[type="text"],
  #siteSettingsPanel textarea{
    font-size:12px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    width:100%;
    font-family:inherit;
    margin-bottom:6px;
    box-sizing:border-box;
  }
  #siteSettingsPanel textarea{ resize:vertical; }
  #siteSettingsPanel button{
    font-size:12px;
    font-weight:700;
    padding:8px 9px;
    border:none;
    border-radius:5px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
    margin-top:6px;
  }
  #siteSettingsPanel button:disabled{
    opacity:.5;
    cursor:default;
  }
  #ssStatus{
    color:var(--sub);
    min-height:14px;
    line-height:1.5;
  }
  .hide-toggle-btn{
    position:absolute;
    top:6px; right:6px;
    z-index:5;
    font-size:10px;
    padding:4px 7px;
    border:none;
    border-radius:4px;
    background:rgba(0,0,0,.65);
    color:#fff;
    cursor:pointer;
  }
  .edit-toggle-btn{
    position:absolute;
    top:6px; left:6px;
    z-index:5;
    font-size:10px;
    padding:4px 7px;
    border:none;
    border-radius:4px;
    background:rgba(0,0,0,.65);
    color:#fff;
    cursor:pointer;
  }
  .card.is-hidden .thumb img{
    opacity:.35;
  }
  .hidden-badge{
    display:inline-block;
    margin-left:6px;
    font-size:10px;
    font-weight:700;
    color:#fff;
    background:#b33;
    padding:1px 6px;
    border-radius:3px;
    vertical-align:middle;
  }

  #adminGateOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.75);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:500;
  }
  .admin-gate-box{
    background:var(--card-bg);
    color:var(--ink);
    max-width:360px;
    width:100%;
    border-radius:8px;
    padding:28px 24px;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
    text-align:center;
  }
  .admin-gate-title{
    font-size:16px;
    font-weight:700;
    margin-bottom:6px;
  }
  .admin-gate-desc{
    font-size:12px;
    color:var(--sub);
    margin-bottom:16px;
  }
  .admin-gate-box input[type="password"]{
    width:100%;
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
    margin-bottom:10px;
    box-sizing:border-box;
  }
  .admin-gate-error{
    font-size:12px;
    color:#c0392b;
    min-height:16px;
    margin-bottom:10px;
  }
  .admin-gate-box button{
    width:100%;
    font-size:13px;
    font-weight:700;
    padding:10px 12px;
    border:none;
    border-radius:5px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  .admin-gate-box button:disabled{
    opacity:.6;
    cursor:default;
  }
  #workEditorOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
    z-index:300;
  }
  #workEditorOverlay[hidden]{ display:none; }
  .work-editor{
    background:var(--card-bg);
    color:var(--ink);
    max-width:980px;
    width:100%;
    border-radius:8px;
    padding:28px 28px 32px;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .work-editor h2{
    font-size:16px;
    margin:0 0 16px;
  }
  .we-columns{
    display:flex;
    gap:28px;
    align-items:flex-start;
  }
  .we-form-col{
    flex:1 1 320px;
    min-width:0;
  }
  .we-preview-col{
    flex:1 1 320px;
    min-width:0;
    position:sticky;
    top:0;
  }
  .we-preview-label{
    font-size:11px;
    font-weight:700;
    color:var(--sub);
    margin-bottom:8px;
  }
  .we-preview-box{
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px;
    background:var(--bg);
    max-height:75vh;
    overflow-y:auto;
  }
  @media (max-width:760px){
    .we-columns{ flex-direction:column; }
    .we-preview-col{ position:static; width:100%; }
  }
  .we-field{ margin-bottom:14px; }
  .we-field label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:var(--sub);
    margin-bottom:4px;
  }
  .we-field input[type="text"],
  .we-field textarea{
    width:100%;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
  }
  .we-field textarea{ resize:vertical; }
  .we-thumb-preview{
    width:120px; height:120px;
    border-radius:4px;
    object-fit:cover;
    border:1px solid var(--line);
    background:var(--bg);
    display:block;
    margin-bottom:8px;
  }
  .we-gallery-list{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:8px;
  }
  .we-gallery-item{
    position:relative;
    width:64px; height:64px;
    cursor:grab;
  }
  .we-gallery-item.dragging{
    opacity:0.4;
  }
  .we-gallery-item img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
    display:block;
  }
  .we-gallery-item button{
    position:absolute; top:-6px; right:-6px;
    width:18px; height:18px;
    border-radius:50%;
    border:none;
    background:#b33;
    color:#fff;
    font-size:11px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .we-actions{
    display:flex; gap:8px;
    margin-top:16px;
  }
  .we-actions button{
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border:none;
    border-radius:5px;
    cursor:pointer;
  }
  .we-save-btn{ background:var(--accent); color:#fff; }
  .we-cancel-btn{ background:var(--line); color:var(--ink); }
  .we-delete-btn{ background:#c0392b; color:#fff; margin-left:auto; }
  #weStatus{
    margin-top:10px;
    font-size:12px;
    color:var(--sub);
    line-height:1.6;
    white-space:pre-wrap;
  }

  .rte-toolbar{
    display:flex; flex-wrap:wrap; gap:4px;
    margin-bottom:6px;
  }
  .rte-toolbar select,
  .rte-toolbar input[type="color"]{
    font-size:11px;
    padding:4px 6px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
  }
  .rte-toolbar input[type="color"]{
    padding:2px;
    width:30px;
    height:27px;
    cursor:pointer;
  }
  .rte-color-group{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .rte-swatch{
    width:22px; height:22px;
    border-radius:4px;
    border:1px solid var(--line);
    cursor:pointer;
    padding:0;
  }
  .rte-btn{
    font-size:12px;
    padding:5px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--bg);
    color:var(--ink);
    cursor:pointer;
  }
  .rte-editor{
    min-height:110px;
    max-height:260px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:5px;
    padding:8px 10px;
    background:var(--bg);
    color:var(--ink);
    font-size:13px;
    line-height:1.7;
    white-space:pre-wrap;
  }
  .rte-editor:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .rte-editor a{ color:var(--accent); text-decoration:underline; }
  .rte-link-box{
    margin-top:6px;
    display:flex; gap:6px;
  }
  .rte-link-box input{
    flex:1; min-width:0;
    font-size:12px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
  }
  .rte-link-box button{
    font-size:12px;
    font-weight:700;
    padding:7px 12px;
    border:none;
    border-radius:5px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }

  #avatarCropOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.75);
    display:flex; align-items:center; justify-content:center;
    z-index:400;
  }
  #avatarCropOverlay[hidden]{ display:none; }
  .crop-modal{
    background:var(--card-bg);

    border-radius:8px;
    padding:20px;

    align-items:center;

  .crop-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink);

  .crop-canvas-wrap{
    position:relative;
    width:300px; height:300px;
    border-radius:4px;
    overflow:hidden;
    background:#000;
    cursor:grab;
    touch-action:none;
  }
  .crop-canvas-wrap:active{ cursor:grabbing; }
  .crop-canvas-wrap canvas{ display:block; }
  .crop-mask{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .crop-mask::before{
    content:'';
    position:absolute;
    left:50%; top:50%;
    width:260px; height:260px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    box-shadow:0 0 0 9999px rgba(0,0,0,.55);
  }
  .crop-zoom{ width:300px; }
  .crop-actions{ display:flex; gap:8px; }
  .crop-actions button{
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border:none;
    border-radius:5px;
    cursor:pointer;
  }
  .crop-apply-btn{ background:var(--accent); color:#fff; }
  .crop-cancel-btn{ background:var(--line); color:var(--ink); }

  .we-field input[type="range"]{
    width:100%;
    accent-color:var(--accent);
  }
  .we-range-val{
    font-weight:400;
    color:var(--sub);
    margin-left:4px;
  }
</style>

<body>

<div class="banner"></div>

<div class="wrap">
  <div class="layout">

    <div class="profile">
      <img class="avatar" src="images/avatar.png" alt="kuugaze">
      <h1 id="profileName">kuugaze</h1>
      <p class="role" id="profileRole">Digital Artist based in Tokyo, Japan</p>
      <p class="loc" id="profileLoc">3DCG, VR, AudioVisual</p>
      <div class="socials" id="profileSocials">
        <a id="profileInstagramLink" href="https://instagram.com/kuugaze" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.39A5.9 5.9 0 0 0 .62 4.14C.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.39 2.13a5.9 5.9 0 0 0 2.13 1.39c.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56a5.9 5.9 0 0 0 2.13-1.39 5.9 5.9 0 0 0 1.39-2.13c.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.9 5.9 0 0 0-1.39-2.13A5.9 5.9 0 0 0 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0z"/><path d="M12 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.4a1.44 1.44 0 1 1-1.44-1.44 1.44 1.44 0 0 1 1.44 1.44z"/></svg>
          Instagram
        </a>
        <a id="profileXLink" href="#" target="_blank" rel="noopener" style="display:none">
          <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X
        </a>
      </div>
    </div>

    <div class="grid" id="grid">
      <div class="card about-card" data-modal="about">
        <div class="thumb"><span>about</span></div>
        <div class="caption">about</div>
      </div>
      <!-- work cards are rendered here by script.js from works.json -->
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <button type="button" class="modal-close-btn" id="modalCloseBtn" aria-label="閉じる">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const GH_REPO = 'kuugaze/kuugaze-portfolio';
  let ABOUT = { subtitle: 'about', en: '', jp: '', meta: '', showName: true, showRole: true, showInstagram: true, name: 'kuugaze', role: 'Digital Artist based in Tokyo, Japan', loc: '3DCG, VR, AudioVisual', instagramUrl: 'https://instagram.com/kuugaze', showX: false, xUrl: '' };

  let WORKS = [];
  let WORKS_BY_KEY = {};

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmt(text){
    if(!text) return '';
    let esc = escapeHtml(text);
    esc = esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    esc = esc.replace(/^■.*$/gm, '<strong>$&</strong>');
    return esc;
  }
  function looksLikeRichHtml(s){
    return /<\/?(b|i|em|strong|span|a|br|div|p|u|font)[ >]/i.test(s || '');
  }
  // Manually-inserted rich-text links (via the caption editor's リンク
  // button) were saved without target/rel, so they navigated away in the
  // same tab. This normalizes every <a> in rendered body HTML -- old,
  // already-saved links included -- to always open in a new tab, without
  // needing every past caption to be re-edited and re-saved.
  function ensureLinksOpenNewTab(html){
    if(!html || html.indexOf('<a') === -1) return html;
    const div = document.createElement('div');
    div.innerHTML = html;
    div.querySelectorAll('a').forEach(a => {
      a.setAttribute('target', '_blank');
      if(!a.getAttribute('rel')) a.setAttribute('rel', 'noopener');
    });
    return div.innerHTML;
  }
  function renderBody(text){
    if(!text) return '';
    return ensureLinksOpenNewTab(looksLikeRichHtml(text) ? text : fmt(text));
  }
  function cardHtml(work, isAdminCard){
    const hiddenClass = (isAdminCard && work.hidden) ? ' is-hidden' : '';
    const toggleBtn = isAdminCard
      ? `<button type="button" class="hide-toggle-btn" data-key="${work.key}">${work.hidden ? '表示する' : '非公開にする'}</button>`
      : '';
    const editBtn = isAdminCard
      ? `<button type="button" class="edit-toggle-btn" data-key="${work.key}">編集</button>`
      : '';
    const hiddenBadge = (isAdminCard && work.hidden) ? '<span class="hidden-badge">非公開</span>' : '';
    return `<div class="card${hiddenClass}" data-modal="${work.key}">`
      + `<div class="thumb">${editBtn}${toggleBtn}<img src="${resolveImgSrc(work.thumb)}" alt="" loading="lazy"></div>`
      + `<div class="caption"><span class="cap-label">${escapeHtml(work.category || '')}</span><span class="cap-title">${escapeHtml(work.title || '')}</span>${hiddenBadge}</div>`
      + `</div>`;
  }
  function embedHtml(work){
    if(!work.embed) return '';
    const src = work.embed.type === 'youtube'
      ? `https://www.youtube.com/embed/${work.embed.id}`
      : `https://player.vimeo.com/video/${work.embed.id}${work.embed.h ? '?h='+work.embed.h : ''}`;
    return `<div class="proj-embed"><iframe src="${src}" title="video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  function galleryHtml(images, layout){
    if(!images || !images.length) return '';
    const cls = layout === 'single' ? 'proj-gallery proj-gallery-single' : 'proj-gallery';
    return `<div class="${cls}">${images.map(src=>`<img src="${resolveImgSrc(src)}" alt="" loading="lazy">`).join('')}</div>`;
  }
  function renderProject(d){
    // subtitleEn/subtitleJp are still shown as their own styled heading for
    // works that haven't been resaved since subtitle-editing was retired --
    // that's correct as long as the text only lives there. But the legacy
    // pre-split `subtitle` field (and, for About, the same field) was, for
    // some entries, already folded into the body once by an earlier version
    // of the editor -- so falling back to it here as well would render that
    // same text a second time, right on top of the copy already sitting in
    // the body. Only subtitleEn/subtitleJp themselves are used now; the
    // legacy `subtitle` field is never read for display again.
    const subtitleEn = d.subtitleEn || '';
    const subtitleJp = d.subtitleJp || '';
    let html = '';
    if(subtitleEn) html += `<div class="proj-subtitle">${renderBody(subtitleEn)}</div>`;
    if(d.en) html += `<div class="proj-text">${renderBody(d.en)}</div>`;
    if(d.jp && d.en) html += `<hr class="proj-divider">`;
    if(subtitleJp) html += `<div class="proj-subtitle">${renderBody(subtitleJp)}</div>`;
    if(d.jp) html += `<div class="proj-text">${renderBody(d.jp)}</div>`;
    if(d.heading2) html += `<div class="proj-heading2">${escapeHtml(d.heading2)}</div>`;
    if(d.meta) html += `<div class="proj-meta">${renderBody(d.meta)}</div>`;
    if(d.note) html += `<div class="proj-note">${renderBody(d.note)}</div>`;
    if(d.embed) html += embedHtml(d);
    if(d.images) html += galleryHtml(d.images, d.galleryLayout);
    return html;
  }

  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  const grid = document.getElementById('grid');

  let modalLockScrollY = 0;
  function preventTouchMoveOutsideOverlay(e){
    if(!overlay.contains(e.target)) e.preventDefault();
  }
  function lockBodyScroll(){
    modalLockScrollY = window.scrollY || window.pageYOffset || 0;
    document.documentElement.style.overflow = 'hidden';
    document.body.style.position = 'fixed';
    document.body.style.top = (-modalLockScrollY) + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    document.body.style.overflow = 'hidden';
    document.addEventListener('touchmove', preventTouchMoveOutsideOverlay, { passive: false });
  }
  function unlockBodyScroll(){
    document.removeEventListener('touchmove', preventTouchMoveOutsideOverlay, { passive: false });
    document.documentElement.style.overflow = '';
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    document.body.style.overflow = '';
    window.scrollTo(0, modalLockScrollY);
  }
  function closeModal(){
    overlay.hidden = true;
    body.innerHTML = '';
    unlockBodyScroll();
  }
  function openModal(key){
    const d = key === 'about' ? ABOUT : WORKS_BY_KEY[key];
    if(!d) return;
    body.innerHTML = renderProject(d);
    overlay.hidden = false;
    overlay.scrollTop = 0;
    lockBodyScroll();
  }
  grid.addEventListener('click', (e)=>{
    const card = e.target.closest('[data-modal]');
    if(!card) return;
    openModal(card.dataset.modal);
  });
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && !overlay.hidden) closeModal(); });

  // --- Admin mode: drag-to-reorder (owner only) ---
  const ADMIN_KEY = 'kuugazeadmin';
  const isAdmin = new URLSearchParams(location.search).get(ADMIN_KEY) === '1';

  function getDragAfterElement(container, x, y, dragEl){
    const els = [...container.querySelectorAll('.card:not(.about-card)')].filter(el => el !== dragEl);
    let closest = { el: null, dist: Infinity };
    els.forEach(el => {
      const box = el.getBoundingClientRect();
      const cx = box.left + box.width / 2;
      const cy = box.top + box.height / 2;
      const dist = Math.hypot(x - cx, y - cy);
      if(dist < closest.dist) closest = { el, dist, box, cx };
    });
    if(!closest.el) return null;
    return (x > closest.cx) ? closest.el.nextElementSibling : closest.el;
  }

  function syncWorksOrderFromDom(){
    const keys = [...grid.querySelectorAll('.card[data-modal]')]
      .map(c => c.dataset.modal)
      .filter(k => k !== 'about');
    WORKS = keys.map(k => WORKS_BY_KEY[k]).filter(Boolean);
  }

  function enableDragReorder(){
    document.body.classList.add('admin-mode');
    let dragEl = null;
    grid.querySelectorAll('.card:not(.about-card)').forEach(card => {
      card.draggable = true;
      card.addEventListener('dragstart', () => {
        dragEl = card;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragEl = null;
        syncWorksOrderFromDom();
      });
      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if(!dragEl) return;
        const after =getDragAfterElement(grid, e.clientX, e.clientY, dragEl);
        if(after == null) grid.appendChild(dragEl);
        else grid.insertBefore(dragEl, after);
      });
    });
  }

  function enableHideToggle(){
    grid.querySelectorAll('.hide-toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const key = btn.dataset.key;
        const w = WORKS_BY_KEY[key];
        if(!w) return;
        w.hidden = !w.hidden;
        const card = btn.closest('.card');
        card.classList.toggle('is-hidden', !!w.hidden);
        btn.textContent = w.hidden ? '表示する' : '非公開にする';
        const caption = card.querySelector('.caption');
        const existingBadge = caption.querySelector('.hidden-badge');
        if(w.hidden && !existingBadge){
          const badge = document.createElement('span');
          badge.className = 'hidden-badge';
          badge.textContent = '非公開';
          caption.appendChild(badge);
        }else if(!w.hidden && existingBadge){
          existingBadge.remove();
        }
      });
    });
  }

  function enableEditButtons(){
    grid.querySelectorAll('.edit-toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const key = btn.dataset.key;
        openWorkEditor(WORKS_BY_KEY[key] || null);
      });
    });
  }

  function parseEmbedUrl(url){
    if(!url) return null;
    url = url.trim();
    if(!url) return null;
    let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]v=([a-zA-Z0-9_-]+)/) || url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]+)/);
    if(m) return { type: 'youtube', id: m[1] };
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-zA-Z0-9]+))?/);
    if(m){
      const embed = { type: 'vimeo', id: m[1] };
      if(m[2]) embed.h = m[2];
      return embed;
    }
    return null;
  }
  function embedToUrl(embed){
    if(!embed) return '';
    if(embed.type === 'youtube') return `https://youtu.be/${embed.id}`;
    if(embed.type === 'vimeo') return `https://vimeo.com/${embed.id}${embed.h ? '/'+embed.h : ''}`;
    return '';
  }

  // --- Rich text editor helpers (used for the English/Japanese body fields) ---
  function looksLikeHtml(s){
    return looksLikeRichHtml(s);
  }
  function loadIntoEditor(editorEl, value){
    if(looksLikeHtml(value)) editorEl.innerHTML = value;
    else editorEl.textContent = value || '';
  }
  function serializeEditorContent(editorEl){
    // If the editor has no real formatting tags, prefer textContent over
    // innerHTML: innerHTML always HTML-escapes characters like & < >, and
    // re-saving that escaped-but-tagless text would otherwise corrupt it a
    // little more on every save (& becoming &amp; becoming &amp;amp; ...).
    const html = editorEl.innerHTML;
    return looksLikeHtml(html) ? html : editorEl.textContent;
  }
  // Merges `extra` text/HTML into `base` (used to fold a removed field's
  // content into the body so nothing is lost, and its own color/font/size
  // formatting survives instead of being flattened to plain text).
  function mergeIntoBody(base, extra, prepend){
    if(!extra) return base;
    if(!base) return extra;
    if(looksLikeHtml(base) || looksLikeHtml(extra)){
      const baseHtml = looksLikeHtml(base) ? base : escapeHtml(base).replace(/\n/g, '<br>');
      const extraHtml = looksLikeHtml(extra) ? extra : escapeHtml(extra).replace(/\n/g, '<br>');
      return prepend ? (extraHtml + '<br><br>' + baseHtml) : (baseHtml + '<br><br>' + extraHtml);
    }
    return prepend ? (extra + '\n\n' + base) : (base + '\n\n' + extra);
  }
  function askLinkUrlInline(container){
    return new Promise((resolve) => {
      const existing = container.querySelector('.rte-link-box');
      if(existing) existing.remove();
      const box = document.createElement('div');
      box.className = 'rte-link-box';
      box.innerHTML = `
        <input type="text" placeholder="https://example.com">
        <button type="button" data-act="ok">設定</button>
        <button type="button" data-act="cancel">キャンセル</button>
      `;
      container.appendChild(box);
      const input = box.querySelector('input');
      input.focus();
      function finish(val){
        box.remove();
        resolve(val);
      }
      box.querySelector('[data-act="ok"]').addEventListener('click', () => finish(input.value.trim()));
      box.querySelector('[data-act="cancel"]').addEventListener('click', () => finish(null));
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); finish(input.value.trim()); }
        if(e.key === 'Escape'){ e.preventDefault(); finish(null); }
      });
    });
  }
  function applyFontSize(editorEl, px){
    document.execCommand('fontSize', false, '7');
    editorEl.querySelectorAll('font[size="7"]').forEach(el => {
      el.removeAttribute('size');
      el.style.fontSize = px + 'px';
    });
  }
  function setupRichEditor(toolbarEl, editorEl, onChange){
    editorEl.setAttribute('contenteditable', 'true');
    try{ document.execCommand('defaultParagraphSeparator', false, 'br'); }catch(e){}

    const fontSelect = toolbarEl.querySelector('.rte-font');
    const sizeSelect = toolbarEl.querySelector('.rte-size');
    const colorInput = toolbarEl.querySelector('.rte-color');
    const boldBtn = toolbarEl.querySelector('[data-cmd="bold"]');
    const italicBtn = toolbarEl.querySelector('[data-cmd="italic"]');
    const normalBtn = toolbarEl.querySelector('[data-cmd="removeFormat"]');
    const linkBtn = toolbarEl.querySelector('[data-cmd="link"]');

    // Clicking a native <select>/<input type="color"> steals focus (and the
    // browser's text Selection) away from the contenteditable before its
    // change/input event fires. Keep track of the last real selection made
    // inside the editor so we can restore it right before running a
    // formatting command from the toolbar.
    let savedRange = null;
    // The size dropdown otherwise keeps whatever value it last showed, so
    // re-picking that same value (while the actually-selected text is a
    // different size) fires no native change event and applyFontSize never
    // runs. Syncing the dropdown to the real current selection's size on
    // every selection change means any deliberate choice always differs from
    // what's shown, so it always fires.
    function getSelectionFontSize(){
      const sel = window.getSelection();
      if(!sel || sel.rangeCount === 0) return null;
      let node = sel.anchorNode;
      if(!node || !editorEl.contains(node)) return null;
      if(node.nodeType === Node.TEXT_NODE) node = node.parentNode;
      while(node && node !== editorEl){
        if(node.style && node.style.fontSize){
          return parseInt(node.style.fontSize, 10);
        }
        node = node.parentNode;
      }
      return 13; // base .proj-text size when no explicit size is set
    }
    function syncSizeSelect(){
      if(!sizeSelect) return;
      const size = getSelectionFontSize();
      if(size == null) return;
      const hasOption = Array.from(sizeSelect.options).some(o => o.value === String(size));
      sizeSelect.value = hasOption ? String(size) : '';
    }
    function saveSelection(){
      const sel = window.getSelection();
      if(sel && sel.rangeCount > 0 && editorEl.contains(sel.anchorNode)){
        savedRange = sel.getRangeAt(0).cloneRange();
      }
      syncSizeSelect();
    }
    editorEl.addEventListener('mouseup', saveSelection);
    editorEl.addEventListener('keyup', saveSelection);
    editorEl.addEventListener('input', saveSelection);
    if(onChange) editorEl.addEventListener('input', onChange);

    function focusEditor(){
      editorEl.focus();
      if(savedRange){
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);
      }
    }

    if(fontSelect){
      fontSelect.addEventListener('mousedown', saveSelection);
      fontSelect.addEventListener('change', () => {
        if(!fontSelect.value) return;
        focusEditor();
        document.execCommand('fontName', false, fontSelect.value);
        if(onChange) onChange();
      });
    }
    if(sizeSelect){
      sizeSelect.addEventListener('mousedown', saveSelection);
      sizeSelect.addEventListener('change', () => {
        if(!sizeSelect.value) return;
        focusEditor();
        applyFontSize(editorEl, sizeSelect.value);
        if(onChange) onChange();
      });
    }
    if(colorInput){
      colorInput.addEventListener('mousedown', saveSelection);
      colorInput.addEventListener('input', () => {
        focusEditor();
        document.execCommand('foreColor', false, colorInput.value);
        if(onChange) onChange();
      });
    }
    toolbarEl.querySelectorAll('.rte-swatch').forEach(swatchBtn => {
      swatchBtn.addEventListener('mousedown', saveSelection);
      swatchBtn.addEventListener('click', () => {
        focusEditor();
        document.execCommand('foreColor', false, swatchBtn.dataset.color);
        if(onChange) onChange();
      });
    });
    if(boldBtn){

        if(!url) return;
        // If the admin typed a bare domain (no scheme, e.g. "example.com"
        // instead of "https://example.com"), the browser saves it as a
        // relative URL -- it looks fine in the editor but 404s once
        // clicked on the live site. Auto-prepend https:// unless the
        // input already has a scheme, or is an in-page path/anchor.
        if(!/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(url)){

        editorEl.querySelectorAll('a').forEach(a => {

  // --- Profile-image cropper: lets the admin pick a photo and crop it to a
  // square before it's uploaded, so the circular avatar always frames
  // correctly regardless of the source image's shape. onDone receives a
  // cropped PNG Blob, or null if the admin cancelled. ---
  function openAvatarCropper(file, onDone){
    const existing = document.getElementById('avatarCropOverlay');
    if(existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.id = 'avatarCropOverlay';
    overlay.innerHTML = `
      <div class="crop-modal">
        <div class="crop-title">プロフィール画像をトリミング</div>
        <div class="crop-canvas-wrap" id="cropCanvasWrap">
          <canvas id="cropCanvas" width="300" height="300"></canvas>
          <div class="crop-mask"></div>
        </div>
        <input type="range" class="crop-zoom" id="cropZoom" min="1" max="3" step="0.01" value="1">
        <div class="crop-actions">
          <button type="button" class="crop-apply-btn" id="cropApplyBtn">適用</button>
          <button type="button" class="crop-cancel-btn" id="cropCancelBtn">キャンセル</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const C = 300;
    const canvas = overlay.querySelector('#cropCanvas');
    const ctx = canvas.getContext('2d');
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    let baseScale = 1, zoom = 1, offsetX = 0, offsetY = 0, drawW = 0, drawH = 0;

    function recompute(){
      const scale = baseScale * zoom;
      drawW = img.naturalWidth * scale;
      drawH = img.naturalHeight * scale;
    }
    function clampOffsets(){
      offsetX = Math.min(0, Math.max(offsetX, C - drawW));
      offsetY = Math.min(0, Math.max(offsetY, C - drawH));
    }
    function draw(){
      ctx.clearRect(0, 0, C, C);
      ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
    }

    img.onload = () => {
      baseScale = Math.max(C / img.naturalWidth, C / img.naturalHeight);
      zoom = 1;
      recompute();
      offsetX = (C - drawW) / 2;
      offsetY = (C - drawH) / 2;
      draw();
    };
    img.src = objectUrl;

    const wrap = overlay.querySelector('#cropCanvasWrap');
    let dragging = false, lastX = 0, lastY = 0;
    wrap.addEventListener('pointerdown', (e) => {
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
      wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener('pointermove', (e) => {
      if(!dragging) return;
      offsetX += e.clientX - lastX;
      offsetY += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      clampOffsets();
      draw();
    });
    wrap.addEventListener('pointerup', () => { dragging = false; });
    wrap.addEventListener('pointercancel', () => { dragging = false; });

    const zoomSlider = overlay.querySelector('#cropZoom');
    zoomSlider.addEventListener('input', () => {
      // Keep the point under the canvas center stable while zooming.
      const cx = C / 2, cy = C / 2;
      const relX = drawW ? (cx - offsetX) / drawW : 0.5;
      const relY = drawH ? (cy - offsetY) / drawH : 0.5;
      zoom = parseFloat(zoomSlider.value);
      recompute();
      offsetX = cx - relX * drawW;
      offsetY = cy - relY * drawH;
      clampOffsets();
      draw();
    });

    function cleanup(){
      URL.revokeObjectURL(objectUrl);
      overlay.remove();
    }
    overlay.querySelector('#cropCancelBtn').addEventListener('click', () => {
      cleanup();
      onDone(null);
    });
    overlay.querySelector('#cropApplyBtn').addEventListener('click', () => {
      const OUT = 480;
      const outCanvas = document.createElement('canvas');
      outCanvas.width = OUT; outCanvas.height = OUT;
      const outCtx = outCanvas.getContext('2d');
      const f = OUT / C;
      outCtx.drawImage(img, offsetX * f, offsetY * f, drawW * f, drawH * f);
      outCanvas.toBlob((blob) => {
        cleanup();
        onDone(blob);
      }, 'image/png');
    });
  }

  // --- Publish via the kuugaze-site-update Cloudflare Worker: the admin
  // panel POSTs the payload (plus any new image files) straight to the
  // Worker, which authenticates the request and writes works.json /
  // about.json / images/* to GitHub directly. Nothing is committed to the
  // repo from this page itself, and no GitHub token is ever present in
  // this file's source — only a per-admin shared secret, entered once by
  // the admin and kept in this browser's local storage. ---
  const WORKER_URL = 'https://kuugaze-site-update.kuugaze.workers.dev';
  const ADMIN_SECRET_KEY = 'kuugazeAdminSecret';

  // --- Admin-mode gate: ?kuugazeadmin=1 alone must never reveal hidden
  // works or the editing UI. Before anything admin-only renders, the
  // entered secret is checked against the Worker itself (the only place
  // that actually knows ADMIN_SECRET). The check uses an unrecognized
  // payload type, so it never reaches — and can never trigger — any of
  // the Worker's GitHub read/write branches: a wrong secret gets 401,
  // a right one gets past the auth check and only then hits "unknown
  // type", which is how a correct key is told apart from an incorrect
  // one without writing anything. ---
  async function checkSecretAgainstWorker(secret){
    try{
      const form = new FormData();
      form.append('payload', JSON.stringify({ type: '__verify__' }));
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${secret}` },
        body: form
      });
      return res.status !== 401;
    }catch(e){
      return false;
    }
  }

  // --- Fetch the FULL works data (including hidden works) for the admin
  // panel. The public works.json served by GitHub Pages never contains
  // hidden works at all -- only this authenticated request can see them. ---
  async function fetchFullDataFromWorker(secret){
    const form = new FormData();
    form.append('payload', JSON.stringify({ type: 'full_data' }));
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${secret}` },
      body: form
    });
    if(!res.ok) throw new Error('full_data fetch failed: ' + res.status);
    const data = await res.json();
    if(!data || !data.ok) throw new Error((data && data.error) || 'full_data fetch failed');
    return data;
  }

  // --- Hidden works' image FILES are no longer public (moved server-side
  // into private Worker/KV storage). The admin panel needs to still show
  // their thumbnails/gallery images, so each is fetched here via an
  // authenticated request and turned into a local blob: URL -- never a
  // plain public URL. Visible works' images are untouched and load from
  // GitHub Pages as before (no extra request, no admin-only cost). ---
  const PRIVATE_IMAGE_URLS = new Map();
  function resolveImgSrc(path){
    return PRIVATE_IMAGE_URLS.get(path) || path;
  }
  // Lets an image upload field accept a drag-and-dropped file, not just a
  // click-to-browse selection. zoneEl is the field's whole container (so
  // the drop target is generously sized, not just the tiny native
  // button); dropped files are handed to fileInput via a DataTransfer
  // (the standard way to set input.files programmatically) and a real
  // 'change' event is dispatched, so this reuses each field's existing
  // change handler instead of duplicating its upload logic.
  function enableDropUpload(zoneEl, fileInput){
    if(!zoneEl || !fileInput) return;
    ['dragenter', 'dragover'].forEach(evt => {
      zoneEl.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        zoneEl.classList.add('drag-over');
      });
    });
    ['dragleave', 'dragend'].forEach(evt => {
      zoneEl.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        zoneEl.classList.remove('drag-over');
      });
    });
    zoneEl.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      zoneEl.classList.remove('drag-over');
      const dropped = e.dataTransfer && e.dataTransfer.files;
      if(!dropped || !dropped.length) return;
      const dt = new DataTransfer();
      Array.from(dropped).forEach(f => {
        if(f.type.startsWith('image/')) dt.items.add(f);
      });
      if(!dt.files.length) return;
      fileInput.files = dt.files;
      fileInput.dispatchEvent(new Event('change', { bubbles: true }));
    });
  }
  async function fetchPrivateImage(path, secret){
    const form = new FormData();
    form.append('payload', JSON.stringify({ type: 'get_image', path }));
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${secret}` },
      body: form
    });
    if(!res.ok) throw new Error('get_image fetch failed: ' + res.status);
    return res.blob();
  }
  async function preloadHiddenImages(works, secret){
    const hidden = works.filter(w => w.hidden);
    const paths = new Set();
    hidden.forEach(w => {
      if(w.thumb) paths.add(w.thumb);
      (w.images || []).forEach(p => paths.add(p));
    });
    await Promise.all([...paths].map(async path => {
      if(PRIVATE_IMAGE_URLS.has(path)) return;
      try{
        const blob = await fetchPrivateImage(path, secret);
        PRIVATE_IMAGE_URLS.set(path, URL.createObjectURL(blob));
      }catch(e){
        console.error('Failed to preload hidden image', path, e);
      }
    }));
  }

  function showAdminGate(){
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.id = 'adminGateOverlay';
      overlay.innerHTML = `
        <div class="admin-gate-box">
          <div class="admin-gate-title">管理者ログイン</div>
          <div class="admin-gate-desc">シークレットキーを入力してください</div>
          <input type="password" id="adminGateInput" placeholder="シークレットキー" autocomplete="off">
          <div class="admin-gate-error" id="adminGateError"></div>
          <button type="button" id="adminGateSubmit">ログイン</button>
        </div>
      `;
      document.body.appendChild(overlay);
      const input = overlay.querySelector('#adminGateInput');
      const errorEl = overlay.querySelector('#adminGateError');
      const submitBtn = overlay.querySelector('#adminGateSubmit');
      input.focus();

      let busy = false;
      async function attempt(){
        if(busy) return;
        const val = input.value;
        if(!val) return;
        busy = true;
        submitBtn.disabled = true;
        errorEl.textContent = '確認中…';
        const ok = await checkSecretAgainstWorker(val);
        busy = false;
        submitBtn.disabled = false;
        if(ok){
          localStorage.setItem(ADMIN_SECRET_KEY, val);
          overlay.remove();
          resolve(true);
        }else{
          errorEl.textContent = 'シークレットキーが正しくないか、確認できませんでした。';
          input.select();
        }
      }
      submitBtn.addEventListener('click', attempt);
      input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); attempt(); } });
    });
  }

  async function verifyAdminAccess(){
    const cached = localStorage.getItem(ADMIN_SECRET_KEY);
    if(cached){
      const ok = await checkSecretAgainstWorker(cached);
      if(ok) return true;
      localStorage.removeItem(ADMIN_SECRET_KEY);
    }
    return await showAdminGate();
  }

   function askAdminSecretInline(container){
    return new Promise((resolve) => {
      const box = document.createElement('div');
      box.style.cssText = 'margin-top:8px;display:flex;gap:6px;';
      box.innerHTML = `
        <input type="password" placeholder="シークレットキー" style="flex:1;min-width:0;font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-family:inherit;">
        <button type="button" style="font-size:12px;font-weight:700;padding:7px 12px;border:none;border-radius:5px;background:var(--accent);color:#fff;cursor:pointer;">OK</button>
      `;
      container.appendChild(box);
      const input = box.querySelector('input');
      const okBtn = box.querySelector('button');
      input.focus();
      function finish(){
        const val = input.value;
        box.remove();
        resolve(val);
      }
      okBtn.addEventListener('click', finish);
      input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter'){ e.preventDefault(); finish(); }

  async function getAdminSecret(statusEl){
    let secret = localStorage.getItem(ADMIN_SECRET_KEY);
    if(secret) return secret;
    const container = statusEl ? statusEl.parentNode : document.body;
    if(statusEl) statusEl.textContent = '初回のみ、管理用のシークレットキーを入力してください（この端末に保存されます）';
    secret = await askAdminSecretInline(container);
    if(secret) localStorage.setItem(ADMIN_SECRET_KEY, secret);
    return secret;
  }

  async function publishSiteUpdate(payload, files, statusEl){
    const secret = await getAdminSecret(statusEl);
    if(!secret){
      if(statusEl) statusEl.textContent = 'シークレットキーが入力されなかったため、公開を中止しました。';
      return false;
    }
    const form = new FormData();
    form.append('payload', JSON.stringify(payload));
    if(files){
      Object.keys(files).forEach(token => {
        if(files[token]) form.append(token, files[token]);
      });
    }
    if(statusEl) statusEl.textContent = '公開処理中…';
    try{
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${secret}` },
        body: form
      });
      let data = {};
      try{ data = await res.json(); }catch(e){}
      if(res.ok && data.ok){
        if(statusEl) statusEl.textContent = data.message || '公開しました。数分でサイトに反映されます。';
        return true;
      }
      if(res.status === 401){
        localStorage.removeItem(ADMIN_SECRET_KEY);
        if(statusEl) statusEl.textContent = 'シークレットキーが正しくありません。もう一度お試しください。';
      }else if(statusEl){
        statusEl.textContent = 'エラーが発生しました: ' + (data.error || res.status);
      }
      return false;
    }catch(err){
      if(statusEl) statusEl.textContent = '通信エラーが発生しました: ' + err.message;
      return false;
    }
  }

  // Ctrl+Shift+R-equivalent: a real browser hard-reload can't be triggered
  // from page script, so this gets as close as script can -- navigating to
  // the same URL with a fresh cache-busting param, forcing the browser to
  // treat the document as new rather than serving a cached copy. Used
  // after a successful save so the page (and any open editor overlay,
  // which a full reload naturally clears) always reflects what was just
  // published.
  function hardReload(){
    const url = new URL(location.href);
    url.searchParams.set('_r', Date.now());
    location.href = url.toString();
  }

  // Applies the About-thumb-color / caption-style settings as CSS custom
  // properties. Each one applies only when individually set on its own
  // field (there used to also be a site-wide "theme color" override here
  // that replaced all of these at once -- that feature was removed, so
  // each color/font/weight/size now always comes from its own field).
  function setCssVar(name, value){
    if(value !== null && value !== undefined && value !== ''){
      document.documentElement.style.setProperty(name, value);
    }else{
      document.documentElement.style.removeProperty(name);
    }
  }
  function applyThemeStyleVars(about){
    setCssVar('--about-thumb-color', about.aboutThumbColor || '');
    setCssVar('--caption-label-color', about.captionLabelColor || '');
    setCssVar('--caption-title-color', about.captionTitleColor || '');
    setCssVar('--caption-label-font', about.captionLabelFont || '');
    setCssVar('--caption-label-weight', about.captionLabelWeight || '');
    setCssVar('--caption-label-size', about.captionLabelSize ? about.captionLabelSize + 'px' : '');
    setCssVar('--caption-title-font', about.captionTitleFont || '');
    setCssVar('--caption-title-weight', about.captionTitleWeight || '');
    setCssVar('--caption-title-size', about.captionTitleSize ? about.captionTitleSize + 'px' : '');
  }

    // Video embed + gallery are available for both regular works and About,

        <div class="we-field"><label>動画URL（YouTube / Vimeo・任意）</label><input type="text" id="weEmbed" value="${escapeAttr(embedToUrl(currentEmbed))}" placeholder="https://youtu.be/..."></div>

    const overlay = document.createElement('div');
    overlay.id = 'workEditorOverlay';
    overlay.innerHTML = `
      <div class="work-editor">
        <h2>${isAbout ? 'Aboutを編集' : (isNew ? '新しい作品を追加' : '作品を編集')}</h2>
        <div class="we-columns">

    if(isAbout){

      aboutThumbColorEnabledInput.addEventListener('change', applyAboutThumbColorPreview);

    function buildPreviewData(){
      const embed = parseEmbedUrl(overlay.querySelector('#weEmbed')?.value || '');
      const images = weState.galleryOrder.map(it => it.kind === 'existing' ? resolveImgSrc(it.ref) : URL.createObjectURL(it.ref));
      const galleryLayout = overlay.querySelector('#weGalleryLayout')?.value || 'grid';
      if(isAbout){
        const weAboutEnEl = overlay.querySelector('#weAboutEn');
        const weAboutJpEl = overlay.querySelector('#weAboutJp');
        return {
          en: weAboutEnEl ? serializeEditorContent(weAboutEnEl) : '',
          jp: weAboutJpEl ? serializeEditorContent(weAboutJpEl) : '',
          embed,
          images,
          galleryLayout

      }
      const weEnEl = overlay.querySelector('#weEn');
      const weJpEl = overlay.querySelector('#weJp');
      return {
        en: weEnEl ? serializeEditorContent(weEnEl) : '',
        jp: weJpEl ? serializeEditorContent(weJpEl) : '',
        embed,
        images,
        galleryLayout
      };
    }
    function updatePreview(){
      const previewBody = overlay.querySelector('#wePreviewBody');
      if(!previewBody) return;
      previewBody.innerHTML = renderProject(buildPreviewData());
    }

    if(!isAbout){
      const weEnEl = overlay.querySelector('#weEn');
      const weJpEl = overlay.querySelector('#weJp');
      let initialEn = isNew ? '' : (work.en || '');
      let initialJp = isNew ? '' : (work.jp || '');
      // The subtitle field was removed -- fold any existing subtitle text
      // (with its own color/font/size formatting) into the top of the body so
      // nothing is lost, and it's all editable in one place from now on.
      // Written back with subtitleEn/Jp cleared the next time this work is
      // saved.
      if(!isNew && work){
        initialEn = mergeIntoBody(initialEn, work.subtitleEn || work.subtitle || '', true);
        initialJp = mergeIntoBody(initialJp, work.subtitleJp || work.subtitle || '', true);
      }
      // Legacy works may still hold text in the old, separate heading2/meta/note
      // fields (no longer editable on their own). Fold that text into the body
      // so it becomes visible and editable in place; it's written back into
      // en/jp (and heading2/meta/note cleared) the next time this work is saved.
      if(!isNew && work && (work.heading2 || work.meta || work.note)){
        const extraParts = [];
        if(work.heading2) extraParts.push('■' + work.heading2);
        if(work.meta) extraParts.push(work.meta);
        if(work.note) extraParts.push(work.note);
        const extraText = extraParts.join('\n\n');
        initialEn = mergeIntoBody(initialEn, extraText, false);
        initialJp = mergeIntoBody(initialJp, extraText, false);
      }
      loadIntoEditor(weEnEl, initialEn);
      loadIntoEditor(weJpEl, initialJp);
      setupRichEditor(overlay.querySelector('.we-en-toolbar'), weEnEl, updatePreview);
      setupRichEditor(overlay.querySelector('.we-jp-toolbar'), weJpEl, updatePreview);
      overlay.querySelector('#weCategory')?.addEventListener('input', updatePreview);
      overlay.querySelector('#weTitle')?.addEventListener('input', updatePreview);
    }else{
      const weAboutEnEl = overlay.querySelector('#weAboutEn');
      const weAboutJpEl = overlay.querySelector('#weAboutJp');
      const initialAboutEn = mergeIntoBody(ABOUT.en || '', ABOUT.subtitleEn || ABOUT.subtitle || '', true);
      const initialAboutJp = mergeIntoBody(ABOUT.jp || '', ABOUT.subtitleJp || ABOUT.subtitle || '', true);
      loadIntoEditor(weAboutEnEl, initialAboutEn);
      loadIntoEditor(weAboutJpEl, initialAboutJp);
      setupRichEditor(overlay.querySelector('.we-about-en-toolbar'), weAboutEnEl, updatePreview);
      setupRichEditor(overlay.querySelector('.we-about-jp-toolbar'), weAboutJpEl, updatePreview);
    }
    // Video embed + gallery live outside the isAbout branch above since both
    // work and About now share these fields.
    overlay.querySelector('#weEmbed')?.addEventListener('input', updatePreview);
    overlay.querySelector('#weGalleryLayout')?.addEventListener('change', updatePreview);

    // Finds the gallery item a dragged thumbnail should be inserted before,
    // by nearest-center distance -- the same technique used for reordering
    // work cards on the main grid, kept as its own small copy here since
    // that one is hardcoded to the `.card` selector.
    function getGalleryDragAfterElement(container, x, y, dragEl){
      const els = [...container.querySelectorAll('.we-gallery-item')].filter(el => el !== dragEl);
      let closest = { el: null, dist: Infinity };
      els.forEach(el => {
        const box = el.getBoundingClientRect();
        const cx = box.left + box.width / 2;
        const cy = box.top + box.height / 2;
        const dist = Math.hypot(x - cx, y - cy);
        if(dist < closest.dist) closest = { el, dist, cx };
      });
      if(!closest.el) return null;
      return (x > closest.cx) ? closest.el.nextElementSibling : closest.el;
    }
    let galleryDragIdx = null;
    function renderGalleryList(){
      const list = overlay.querySelector('#weGalleryList');
      if(!list) return;
      let html = '';
      weState.galleryOrder.forEach((it, i) => {
        const src = it.kind === 'existing' ? resolveImgSrc(it.ref) : URL.createObjectURL(it.ref);
        html += `<div class="we-gallery-item" draggable="true" data-order-idx="${i}"><img src="${escapeAttr(src)}" alt=""><button type="button" data-idx="${i}">×</button></div>`;
      });
      list.innerHTML = html;
      list.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          const idx = parseInt(b.dataset.idx, 10);
          weState.galleryOrder.splice(idx, 1);
          renderGalleryList();
          updatePreview();
        });
      });
      list.querySelectorAll('.we-gallery-item').forEach(el => {
        el.addEventListener('dragstart', () => {
          galleryDragIdx = parseInt(el.dataset.orderIdx, 10);
          el.classList.add('dragging');
        });
        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
          galleryDragIdx = null;
        });
      });
    }
    // Gallery + thumbnail are shared by both work and About editors now, so
    // none of this is gated by isAbout any more.
    renderGalleryList();
    {
      // Bound once (not inside renderGalleryList, which reruns on every
      // add/remove/reorder) so the list container doesn't accumulate a
      // duplicate listener on each re-render.
      const galleryList = overlay.querySelector('#weGalleryList');
      galleryList.addEventListener('dragover', (e) => {
        if(galleryDragIdx === null) return;
        e.preventDefault();
        const dragging = galleryList.querySelector('.we-gallery-item.dragging');
        if(!dragging) return;
        const after = getGalleryDragAfterElement(galleryList, e.clientX, e.clientY, dragging);
        if(after == null) galleryList.appendChild(dragging);
        else galleryList.insertBefore(dragging, after);
      });
      galleryList.addEventListener('drop', (e) => {
        if(galleryDragIdx === null) return;
        e.preventDefault();
        const newOrder = [...galleryList.querySelectorAll('.we-gallery-item')]
          .map(el => weState.galleryOrder[parseInt(el.dataset.orderIdx, 10)]);
        weState.galleryOrder = newOrder;
        renderGalleryList();
        updatePreview();
      });
    }

    {
      const thumbFileInput = overlay.querySelector('#weThumbFile');
      const thumbPreview = overlay.querySelector('#weThumbPreview');
      thumbFileInput.addEventListener('change', () => {
        const f = thumbFileInput.files[0];
        if(!f) return;
        weState.pendingThumbFile = f;
        thumbPreview.src = URL.createObjectURL(f);
        thumbPreview.style.display = 'block';
      });

      const galleryFileInput = overlay.querySelector('#weGalleryFile');
      galleryFileInput.addEventListener('change', () => {
        Array.from(galleryFileInput.files).forEach(f => weState.galleryOrder.push({ kind: 'pending', ref: f }));
        galleryFileInput.value = '';
        renderGalleryList();
        updatePreview();
      });

      enableDropUpload(thumbFileInput.closest('.we-field'), thumbFileInput);
      enableDropUpload(galleryFileInput.closest('.we-field'), galleryFileInput);
    }

    updatePreview();

    overlay.querySelector('#weCancelBtn').addEventListener('click', () => {
      overlay.remove();

    });

    overlay.querySelector('#weCopyBtn').addEventListener('click', async () => {
      const status = overlay.querySelector('#weStatus');

      // Thumbnail + video embed + gallery are shared by both work and About
      // saves now, so this part is built once regardless of isAbout.
      const embed = parseEmbedUrl(overlay.querySelector('#weEmbed').value);
      const files = {};
      if(weState.pendingThumbFile) files['THUMB'] = weState.pendingThumbFile;
      // Assign upload tokens (GAL1, GAL2, ...) to pending files in their
      // CURRENT (possibly drag-reordered) position, and build imageOrder as
      // the full interleaved sequence of existing paths and new-upload
      // tokens -- this is what lets the Worker place newly-added images
      // anywhere in the gallery, not just appended at the end.
      let galIdx = 0;
      const imageOrder = weState.galleryOrder.map(it => {
        if(it.kind === 'existing') return it.ref;
        galIdx++;
        const token = `GAL${galIdx}`;
        files[token] = it.ref;
        return token;
      });
      const existingImages = weState.galleryOrder.filter(it => it.kind === 'existing').map(it => it.ref);
      const newGalleryImages = imageOrder.filter(t => /^GAL\d+$/.test(t));
      const galleryLayout = overlay.querySelector('#weGalleryLayout').value;

      if(isAbout){
        const payload = {
          type: 'about',
          subtitleEn: '',
          subtitleJp: '',
          en: serializeEditorContent(overlay.querySelector('#weAboutEn')).trim(),
          jp: serializeEditorContent(overlay.querySelector('#weAboutJp')).trim(),
          name: ABOUT.name || 'kuugaze',
          role: ABOUT.role || 'Digital Artist based in Tokyo, Japan',
          loc: ABOUT.loc || '3DCG, VR, AudioVisual',
          instagramUrl: ABOUT.instagramUrl || 'https://instagram.com/kuugaze',
          showName: ABOUT.showName !== false,
          showRole: ABOUT.showRole !== false,
          showInstagram: ABOUT.showInstagram !== false,
          showX: ABOUT.showX === true,
          showCaptions: ABOUT.showCaptions !== false,
          xUrl: ABOUT.xUrl || '',
          bannerHeight: ABOUT.bannerHeight || 190,
          siteWidth: ABOUT.siteWidth || 1240,
          gridColumns: ABOUT.gridColumns || 4,
          gridGapX: ABOUT.gridGapX ?? 16,
          gridGapY: ABOUT.gridGapY ?? 20,
          // This is the one theme-style field actually edited on this
          // screen; the rest below are pass-throughs of the current value
          // so this save doesn't wipe out what the site settings panel set.
          aboutThumbColor: overlay.querySelector('#weAboutThumbColorEnabled').checked
            ? overlay.querySelector('#weAboutThumbColor').value : '',
          captionLabelColor: ABOUT.captionLabelColor || '',
          captionLabelFont: ABOUT.captionLabelFont || '',
          captionLabelWeight: ABOUT.captionLabelWeight || '',
          captionLabelSize: ABOUT.captionLabelSize || null,
          captionTitleColor: ABOUT.captionTitleColor || '',
          captionTitleFont: ABOUT.captionTitleFont || '',
          captionTitleWeight: ABOUT.captionTitleWeight || '',
          captionTitleSize: ABOUT.captionTitleSize || null,
          newAvatar: null,
          newBanner: null,
          embed,
          existingImages,
          imageOrder,
          currentThumb: ABOUT.thumb || null,
          newThumbnail: weState.pendingThumbFile ? 'THUMB' : null,
          newGalleryImages,
          galleryLayout
        };
        const success = await publishSiteUpdate(payload, files, status);
        if(success){
          ABOUT.subtitleEn = payload.subtitleEn;
          ABOUT.subtitleJp = payload.subtitleJp;
          ABOUT.en = payload.en;
          ABOUT.jp = payload.jp;
          ABOUT.aboutThumbColor = payload.aboutThumbColor;
          hardReload();
        }
        return;
      }

      const title = overlay.querySelector('#weTitle').value.trim();
      if(!title){ status.textContent = 'タイトルを入力してください'; return; }
      const category = overlay.querySelector('#weCategory').value.trim();
      const payload = {
        type: 'work',
        key: weState.key,
        original: (!isNew && work) ? work : null,
        category,
        title,
        subtitleEn: '',
        subtitleJp: '',
        jp: serializeEditorContent(overlay.querySelector('#weJp')).trim(),
        en: serializeEditorContent(overlay.querySelector('#weEn')).trim(),
        heading2: '',
        meta: '',
        note: '',
        embed,
        existingImages,
        imageOrder,
        currentThumb: (!isNew && work) ? work.thumb : null,
        newThumbnail: weState.pendingThumbFile ? 'THUMB' : null,
        newGalleryImages,
        galleryLayout
      };
      const workSaveSuccess = await publishSiteUpdate(payload, files, status);
      if(workSaveSuccess) hardReload();
    });

    const deleteBtn = overlay.querySelector('#weDeleteBtn');
    if(deleteBtn){
      deleteBtn.addEventListener('click', async () => {
        const status = overlay.querySelector('#weStatus');
        status.innerHTML = '';
        const ok = await askConfirmInline(status.parentNode, `「${work.title}」を削除します。よろしいですか？（元に戻せません）`);
        if(!ok) return;
        deleteBtn.disabled = true;
        const success = await publishSiteUpdate({ type: 'delete', key: weState.key }, {}, status);
        if(success){
          setTimeout(() => { overlay.remove(); weState = null; }, 1200);
        }else{
          deleteBtn.disabled = false;
        }
      });
    }
  }

      const url = URL.createObjectURL(f);
      panel.querySelector('#ssBannerPreview').src = url;
      const realBanner = document.querySelector('.banner');
      if(realBanner) realBanner.style.backgroundImage = `url("${url}")`;

    enableDropUpload(bannerFileInput.closest('.we-field'), bannerFileInput);
