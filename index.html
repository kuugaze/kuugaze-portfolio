<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuu gaze</title>
<style>
  :root{
    --bg:#f4f4f2;
    --card-bg:#ffffff;
    --ink:#1a1a1a;
    --sub:#6b6b6b;
    --line:#e2e2df;
    --accent:#2b3fff;
    --modal-sub:var(--sub);
    --modal-line:var(--line);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141416;
      --card-bg:#1d1d20;
      --ink:#f2f2f0;
      --sub:#9c9c9c;
      --line:#2c2c2f;
      --accent:#7c8aff;
      --modal-sub:#eaeaea;
      --modal-line:rgba(255,255,255,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141416;
    --card-bg:#1d1d20;
    --ink:#f2f2f0;
    --sub:#9c9c9c;
    --line:#2c2c2f;
    --accent:#7c8aff;
    --modal-sub:#eaeaea;
    --modal-line:rgba(255,255,255,.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  }
  a{color:inherit;text-decoration:none;}

  .banner{
    width:100%;
    height:190px;
    background-image:url("images/banner.png");
    background-size:cover;
    background-position:center;
  }

  .wrap{
    max-width:1240px;
    margin:0 auto;
    padding:28px 28px 80px;
  }

  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:40px;
    align-items:start;
  }

  .profile{
    padding-top:0;
    position:sticky;
    top:24px;
  }
  .avatar{
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    margin-top:-52px;
    border:4px solid var(--bg);
    display:block;
    background:var(--card-bg);
  }
  .profile h1{
    font-size:20px;
    margin:14px 0 4px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .profile .role{
    font-size:13px;
    color:var(--sub);
    margin:0 0 6px;
    line-height:1.5;
  }
  .profile .loc{
    font-size:12px;
    color:var(--sub);
    margin:0 0 16px;
  }
  .socials{
    display:flex;
    flex-direction:column;
    gap:8px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .socials a{
    font-size:12px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:6px;
    transition:color .15s ease;
  }
  .socials a:hover{ color:var(--accent); }
  .socials svg{ width:14px; height:14px; fill:currentColor; }

  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px 16px;
  }
  .card{
    display:block;
    cursor:pointer;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    background:var(--card-bg);
    border:1px solid var(--line);
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .35s ease, opacity .35s ease;
  }
  .card:hover .thumb img{
    transform:scale(1.04);
    opacity:.92;
  }
  .caption{
    margin-top:9px;
    line-height:1.45;
  }
  .cap-label{
    display:block;
    font-size:11px;
    font-weight:500;
    color:var(--sub);
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .cap-title{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }

  .about-card .thumb{
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--accent);
    background:var(--card-bg);
  }
  .about-card .thumb span{
    font-style:italic;
    font-size:19px;
    color:var(--accent);
  }
  .about-card .caption{ visibility:hidden; }

  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
    .profile{ position:static; }
    .avatar{ margin-top:-40px; }
    .grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:420px){
    .grid{ grid-template-columns:repeat(2,1fr); gap:14px 10px; }
    .wrap{ padding:0 16px 60px; }
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:flex; justify-content:center;
    padding:56px 20px;
    overflow-y:auto;
    z-index:50;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--card-bg);
    color:var(--ink);
    max-width:720px;
    width:100%;
    height:fit-content;
    border-radius:8px;
    padding:40px 44px 48px;
    position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .modal .close{
    position:absolute;
    top:16px; right:18px;
    cursor:pointer;
    font-size:20px;
    color:var(--sub);
    line-height:1;
    background:none;
    border:none;
    z-index:2;
  }
  .proj-subtitle{
    font-style:italic;
    font-weight:700;
    color:var(--accent);
    font-size:22px;
    line-height:1.4;
    margin:0 0 18px;
    text-wrap:balance;
  }
  .proj-heading2{
    font-style:italic;
    font-weight:700;
    color:var(--accent);
    font-size:16px;
    margin:26px 0 12px;
  }
  .proj-text{
    font-size:13px;
    line-height:1.9;
    color:var(--ink);
    white-space:pre-wrap;
    margin:0 0 6px;
  }
  .proj-text strong{ font-weight:700; }
  .proj-text a{ color:var(--accent); text-decoration:underline; word-break:break-all; }
  .proj-divider{
    border:none;
    border-top:1px dashed var(--modal-line);
    margin:20px 0;
  }
  .proj-meta{
    font-size:12px;
    line-height:1.9;
    color:var(--modal-sub);
    white-space:pre-wrap;
    margin:0 0 6px;
  }
  .proj-note{
    font-size:11.5px;
    line-height:1.8;
    color:var(--modal-sub);
    white-space:pre-wrap;
    margin:18px 0 0;
  }
  .proj-embed{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:16/9;
    margin:22px 0 0;
    border-radius:4px;
    overflow:hidden;
    background:#000;
  }
  .proj-embed iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .proj-gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin:22px 0 0;
  }
  .proj-gallery img{
    width:100%;
    display:block;
    border-radius:2px;
  }
  @media (max-width:600px){
    .modal{ padding:30px 20px 36px; }
    .proj-subtitle{ font-size:19px; }
    .proj-gallery{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="banner"></div>

<div class="wrap">
  <div class="layout">

    <div class="profile">
      <img class="avatar" src="images/avatar.png" alt="kuu gaze">
      <h1>kuu gaze</h1>
      <p class="role">Digital Artist based in Tokyo, Japan</p>
      <p class="loc">3DCG, VR, AudioVisual</p>
      <div class="socials">
        <a href="https://instagram.com/kuugaze" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.39A5.9 5.9 0 0 0 .62 4.14C.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.39 2.13a5.9 5.9 0 0 0 2.13 1.39c.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56a5.9 5.9 0 0 0 2.13-1.39 5.9 5.9 0 0 0 1.39-2.13c.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.9 5.9 0 0 0-1.39-2.13A5.9 5.9 0 0 0 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0z"/><path d="M12 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.4a1.44 1.44 0 1 1-1.44-1.44 1.44 1.44 0 0 1 1.44 1.44z"/></svg>
          Instagram
        </a>
      </div>
    </div>

    <div class="grid" id="grid">
      <div class="card about-card" data-modal="about">
        <div class="thumb"><span>about</span></div>
        <div class="caption">about</div>
      </div>
      <!-- work cards are rendered here by script.js from works.json -->
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <button class="close" id="modalClose">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const ABOUT = {
    subtitle: "about",
    jp: `東京を拠点に活動するデジタルアーティスト、映像監督、3DCGジェネラリスト、VJ。

近年はVirtual Live、VTuber MV、VRコンテンツ開発など、仮想空間での演出、制作に携わる傍ら、2016年から[Alexandros]のライブにて、各公演コンセプトに合わせた独自のVJシステムを開発・提供している等、現実でのインタラクティブコンテンツ開発も行う。

私はクリエイターとして「Kuugaze」と「Yukinomitama」という二つの名前を持っています。作品のコンテキストに応じて、この二つのクリエイティブペルソナを自在に切り替え、新たなインスピレーションを解き放ちます。`,
    meta: `Domains of Expertise
VFX, MotionGraphics, Compositing
Modeling, Rigging, Texturing
VJ system development, Audiovisual Performance

Software
CINEMA4D / Blender / Houdini / TouchDesigner / Unity / UnrealEngine / Notch / SubstancePainter / AfterEffects / etc.`
  };

  let WORKS = [];
  let WORKS_BY_KEY = {};

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmt(text){
    if(!text) return '';
    let esc = escapeHtml(text);
    esc = esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    esc = esc.replace(/^■.*$/gm, '<strong>$&</strong>');
    return esc;
  }
  function cardHtml(work){
    return `<div class="card" data-modal="${work.key}">`
      + `<div class="thumb"><img src="${work.thumb}" alt="" loading="lazy"></div>`
      + `<div class="caption"><span class="cap-label">${escapeHtml(work.category || '')}</span><span class="cap-title">${escapeHtml(work.title || '')}</span></div>`
      + `</div>`;
  }
  function embedHtml(work){
    if(!work.embed) return '';
    const src = work.embed.type === 'youtube'
      ? `https://www.youtube.com/embed/${work.embed.id}`
      : `https://player.vimeo.com/video/${work.embed.id}${work.embed.h ? '?h='+work.embed.h : ''}`;
    return `<div class="proj-embed"><iframe src="${src}" title="video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  function galleryHtml(images){
    if(!images || !images.length) return '';
    return `<div class="proj-gallery">${images.map(src=>`<img src="${src}" alt="" loading="lazy">`).join('')}</div>`;
  }
  function renderProject(d){
    let html = `<div class="proj-subtitle">${escapeHtml(d.subtitle)}</div>`;
    if(d.jp) html += `<div class="proj-text">${fmt(d.jp)}</div>`;
    if(d.jp && d.en) html += `<hr class="proj-divider">`;
    if(d.en) html += `<div class="proj-text">${fmt(d.en)}</div>`;
    if(d.heading2) html += `<div class="proj-heading2">${escapeHtml(d.heading2)}</div>`;
    if(d.meta) html += `<div class="proj-meta">${fmt(d.meta)}</div>`;
    if(d.note) html += `<div class="proj-note">${fmt(d.note)}</div>`;
    if(d.embed) html += embedHtml(d);
    if(d.images) html += galleryHtml(d.images);
    return html;
  }

  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  const grid = document.getElementById('grid');

  function closeModal(){
    overlay.hidden = true;
    body.innerHTML = '';
  }
  function openModal(key){
    const d = key === 'about' ? ABOUT : WORKS_BY_KEY[key];
    if(!d) return;
    body.innerHTML = renderProject(d);
    overlay.hidden = false;
    overlay.scrollTop = 0;
  }
  grid.addEventListener('click', (e)=>{
    const card = e.target.closest('[data-modal]');
    if(!card) return;
    openModal(card.dataset.modal);
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && !overlay.hidden) closeModal(); });

  fetch('works.json')
    .then(r => r.json())
    .then(works => {
      WORKS = works;
      WORKS_BY_KEY = Object.fromEntries(works.map(w => [w.key, w]));
      grid.insertAdjacentHTML('beforeend', works.map(cardHtml).join(''));
    })
    .catch(err => {
      console.error('Failed to load works.json', err);
    });
</script>
</body>
</html>
