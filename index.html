    const roleInput = panel.querySelector('#ssRole');
    function applyRoleInputToPage(){
      const lines = roleInput.value.split('\n');
      const roleEl = document.getElementById('profileRole');
      const locEl = document.getElementById('profileLoc');
      if(roleEl) roleEl.textContent = lines[0] || '';
      if(locEl) locEl.textContent = lines.slice(1).join(' ');
    }
    roleInput.addEventListener('input', applyRoleInputToPage);

    const bannerHeightInput = panel.querySelector('#ssBannerHeight');
    const bannerHeightVal = panel.querySelector('#ssBannerHeightVal');
    bannerHeightInput.addEventListener('input', () => {
      bannerHeightVal.textContent = bannerHeightInput.value + 'px';
      document.documentElement.style.setProperty('--banner-height', bannerHeightInput.value + 'px');
    });

    const siteWidthInput = panel.querySelector('#ssSiteWidth');
    const siteWidthVal = panel.querySelector('#ssSiteWidthVal');
    siteWidthInput.addEventListener('input', () => {
      siteWidthVal.textContent = siteWidthInput.value + 'px';
      document.documentElement.style.setProperty('--site-width', siteWidthInput.value + 'px');
    });

    const gridColumnsInput = panel.querySelector('#ssGridColumns');
    const gridColumnsVal = panel.querySelector('#ssGridColumnsVal');
    gridColumnsInput.addEventListener('input', () => {
      gridColumnsVal.textContent = gridColumnsInput.value + '列';
      document.documentElement.style.setProperty('--grid-columns', gridColumnsInput.value);
    });

    const gridGapXInput = panel.querySelector('#ssGridGapX');
    const gridGapXVal = panel.querySelector('#ssGridGapXVal');
    gridGapXInput.addEventListener('input', () => {
      gridGapXVal.textContent = gridGapXInput.value + 'px';
      document.documentElement.style.setProperty('--grid-gap-x', gridGapXInput.value + 'px');
    });

    const gridGapYInput = panel.querySelector('#ssGridGapY');
    const gridGapYVal = panel.querySelector('#ssGridGapYVal');
    gridGapYInput.addEventListener('input', () => {
      gridGapYVal.textContent = gridGapYInput.value + 'px';
      document.documentElement.style.setProperty('--grid-gap-y', gridGapYInput.value + 'px');
    });

    const showNameInput = panel.querySelector('#ssShowName');
    const showRoleInput = panel.querySelector('#ssShowRole');
    const showInstagramInput = panel.querySelector('#ssShowInstagram');
    const showXInput = panel.querySelector('#ssShowX');
    const showCaptionsInput = panel.querySelector('#ssShowCaptions');
    const instagramUrlInput = panel.querySelector('#ssInstagramUrl');
    const xUrlInput = panel.querySelector('#ssXUrl');
    showNameInput.addEventListener('change', () => {
      const el = document.getElementById('profileName');
      if(el) el.style.display = showNameInput.checked ? '' : 'none';
    });
    showRoleInput.addEventListener('change', () => {
      const roleEl = document.getElementById('profileRole');
      const locEl = document.getElementById('profileLoc');
      if(roleEl) roleEl.style.display = showRoleInput.checked ? '' : 'none';
      if(locEl) locEl.style.display = showRoleInput.checked ? '' : 'none';
    });
    // NOTE: Instagram and X each toggle only their OWN <a> element's
    // display -- they used to both be gated through the shared
    // #profileSocials wrapper, which meant hiding Instagram also hid X.
    function applyInstagramLinkPreview(){
      const el = document.getElementById('profileInstagramLink');
      if(!el) return;
      if(instagramUrlInput.value.trim()) el.href = instagramUrlInput.value.trim();
      el.style.display = showInstagramInput.checked ? '' : 'none';
    }
    showInstagramInput.addEventListener('change', applyInstagramLinkPreview);
    instagramUrlInput.addEventListener('input', applyInstagramLinkPreview);
    function applyXLinkPreview(){
      const el = document.getElementById('profileXLink');
      if(!el) return;
      if(showXInput.checked && xUrlInput.value.trim()){
        el.href = xUrlInput.value.trim();
        el.style.display = '';
      }else{
        el.style.display = 'none';
      }
    }
    showXInput.addEventListener('change', applyXLinkPreview);
    xUrlInput.addEventListener('input', applyXLinkPreview);
    showCaptionsInput.addEventListener('change', () => {
      document.documentElement.classList.toggle('hide-captions', !showCaptionsInput.checked);
    });

    const captionLabelColorInput = panel.querySelector('#ssCaptionLabelColor');
    const captionLabelFontInput = panel.querySelector('#ssCaptionLabelFont');
    const captionLabelWeightInput = panel.querySelector('#ssCaptionLabelWeight');
    const captionLabelSizeInput = panel.querySelector('#ssCaptionLabelSize');
    const captionTitleColorInput = panel.querySelector('#ssCaptionTitleColor');
    const captionTitleFontInput = panel.querySelector('#ssCaptionTitleFont');
    const captionTitleWeightInput = panel.querySelector('#ssCaptionTitleWeight');
    const captionTitleSizeInput = panel.querySelector('#ssCaptionTitleSize');
    function currentCaptionStylePayload(){
      return {
        aboutThumbColor: ABOUT.aboutThumbColor || '',
        captionLabelColor: captionLabelColorInput.value,
        captionLabelFont: captionLabelFontInput.value,
        captionLabelWeight: captionLabelWeightInput.value,
        captionLabelSize: parseInt(captionLabelSizeInput.value, 10) || null,
        captionTitleColor: captionTitleColorInput.value,
        captionTitleFont: captionTitleFontInput.value,
        captionTitleWeight: captionTitleWeightInput.value,
        captionTitleSize: parseInt(captionTitleSizeInput.value, 10) || null,
      };
    }
    function applyCaptionStylePreview(){
      applyThemeStyleVars(currentCaptionStylePayload());
    }
    [captionLabelColorInput, captionLabelFontInput,
     captionLabelWeightInput, captionLabelSizeInput, captionTitleColorInput, captionTitleFontInput,
     captionTitleWeightInput, captionTitleSizeInput].forEach(el => {
      el.addEventListener('input', applyCaptionStylePreview);
      el.addEventListener('change', applyCaptionStylePreview);
    });

    panel.querySelector('#ssSaveBtn').addEventListener('click', async () => {
      const status = panel.querySelector('#ssStatus');
      const roleLines = roleInput.value.split('\n');
      const payload = {
        type: 'about',
        // The subtitle field was retired -- always send empty rather than
        // falling back to the old combined ABOUT.subtitle, which would
        // otherwise resurrect it and get it folded into the body again
        // (duplicated) the next time the About editor is opened.
        subtitleEn: '',
        subtitleJp: '',
        en: ABOUT.en || '',
        jp: ABOUT.jp || '',
        name: nameInput.value.trim(),
        role: (roleLines[0] || '').trim(),
        loc: roleLines.slice(1).join(' ').trim(),
        instagramUrl: instagramUrlInput.value.trim(),
        showName: showNameInput.checked,
        showRole: showRoleInput.checked,
        showInstagram: showInstagramInput.checked,
        showX: showXInput.checked,
        showCaptions: showCaptionsInput.checked,
        xUrl: xUrlInput.value.trim(),
        bannerHeight: parseInt(bannerHeightInput.value, 10),
        siteWidth: parseInt(siteWidthInput.value, 10),
        gridColumns: parseInt(gridColumnsInput.value, 10),
        gridGapX: parseInt(gridGapXInput.value, 10),
        gridGapY: parseInt(gridGapYInput.value, 10),
        ...currentCaptionStylePayload(),
        newAvatar: ssState.pendingAvatarFile ? 'AVATAR' : null,
        newBanner: ssState.pendingBannerFile ? 'BANNER' : null,
        // This panel doesn't edit the thumbnail/video/gallery (that's done in
        // the About content editor) -- pass the current values straight
        // through unchanged so this save doesn't wipe them.
        embed: ABOUT.embed || null,
        galleryLayout: ABOUT.galleryLayout || 'grid',
        existingImages: ABOUT.images || [],
        imageOrder: ABOUT.images || [],
        currentThumb: ABOUT.thumb || null,
        newThumbnail: null,
        newGalleryImages: []
      };
      const files = {};
      if(ssState.pendingAvatarFile) files['AVATAR'] = ssState.pendingAvatarFile;
      if(ssState.pendingBannerFile) files['BANNER'] = ssState.pendingBannerFile;
      const success = await publishSiteUpdate(payload, files, status);
      if(success){
        ABOUT.name = payload.name;
        ABOUT.role = payload.role;
        ABOUT.loc = payload.loc;
        ABOUT.instagramUrl = payload.instagramUrl;
        ABOUT.showName = payload.showName;
        ABOUT.showRole = payload.showRole;
        ABOUT.showInstagram = payload.showInstagram;
        ABOUT.showX = payload.showX;
        ABOUT.showCaptions = payload.showCaptions;
        ABOUT.xUrl = payload.xUrl;
        ABOUT.bannerHeight = payload.bannerHeight;
        ABOUT.siteWidth = payload.siteWidth;
        ABOUT.gridColumns = payload.gridColumns;
        ABOUT.gridGapX = payload.gridGapX;
        ABOUT.gridGapY = payload.gridGapY;
        ABOUT.aboutThumbColor = payload.aboutThumbColor;
        ABOUT.captionLabelColor = payload.captionLabelColor;
        ABOUT.captionLabelFont = payload.captionLabelFont;
        ABOUT.captionLabelWeight = payload.captionLabelWeight;
        ABOUT.captionLabelSize = payload.captionLabelSize;
        ABOUT.captionTitleColor = payload.captionTitleColor;
        ABOUT.captionTitleFont = payload.captionTitleFont;
        ABOUT.captionTitleWeight = payload.captionTitleWeight;
        ABOUT.captionTitleSize = payload.captionTitleSize;
        // Every field this panel edits already has a live-preview listener
        // (see above) that applies it to the real page the instant it
        // changes, so the page is already showing the just-saved state --
        // no reload needed. Reloading here would actually be *worse*: it
        // re-fetches index.html/about.json from GitHub Pages, which can
        // still be serving the pre-save version for up to a minute or two
        // after the commit (CDN propagation lag), making a successful save
        // look like it silently reverted.
      }
    });
  }

  function buildAdminPanel(){
    const panel = document.createElement('div');
    panel.id = 'adminPanel';
    panel.innerHTML = `
      <div class="admin-title">管理者モード</div>
      <div class="admin-desc">カードをドラッグして並び替え、左上の「編集」でサムネ・キャプション・画像・動画を変更、右上のボタンで公開・非公開を切り替えられます。変更したらボタンを押すと自動でサイトに反映されます（確認や送信操作は不要です）。</div>
      <button id="adminCopyBtn">並び替え・公開状態を保存する</button>
      <div id="adminStatus"></div>
      <button id="adminAddNewBtn">＋ 新しい作品を追加</button>
      <button id="adminHardReloadBtn" title="Ctrl+Shift+R相当：キャッシュを無視して再読み込み">🔄 強制再読み込み</button>
    `;
    document.body.appendChild(panel);

    const copyBtn = panel.querySelector('#adminCopyBtn');
    const status = panel.querySelector('#adminStatus');
    copyBtn.addEventListener('click', async () => {
      syncWorksOrderFromDom();
      const order = WORKS.map(w => w.key);
      const hidden = WORKS.filter(w => w.hidden).map(w => w.key);
      const payload = { type: 'reorder', order, hidden };
      await publishSiteUpdate(payload, {}, status);
    });

    panel.querySelector('#adminAddNewBtn').addEventListener('click', () => {
      openWorkEditor(null);
    });

    panel.querySelector('#adminHardReloadBtn').addEventListener('click', hardReload);
  }

  function enableAboutEditButton(){
    const aboutThumb = document.querySelector('.about-card .thumb');
    if(!aboutThumb) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'edit-toggle-btn';
    btn.textContent = '編集';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      openWorkEditor(null, { isAbout: true });
    });
    aboutThumb.insertBefore(btn, aboutThumb.firstChild);
  }

  // Fetch the current data from the Worker (which reads it straight from
  // the GitHub Contents API) rather than from GitHub Pages' own copy of
  // works.json/about.json -- GitHub Pages is a static, CDN-cached host, so
  // a page freshly saved by the admin can still serve the old file there
  // for a minute or two after the commit. The Contents API has no such
  // cache, so every visitor sees the latest save immediately. Falls back
  // to the GitHub Pages copy if the Worker is unreachable, so the site
  // still works even if the Worker is down.
  function fetchLive(liveType, staticPath){
    return fetch(WORKER_URL + '?live=' + liveType + '&_=' + Date.now(), { cache: 'no-store' })
      .then(r => { if(!r.ok) throw new Error('live fetch failed: ' + r.status); return r.json(); })
      .catch(() => fetch(staticPath + '?_=' + Date.now(), { cache: 'no-store' }).then(r => r.json()));
  }

  Promise.all([
    fetchLive('works', 'works.json'),
    fetchLive('about', 'about.json').catch(() => null)
  ])
    .then(async ([publicWorks, about]) => {
      let works = publicWorks;
      if(about) ABOUT = about;
      const profileNameEl = document.getElementById('profileName');
      const profileRoleEl = document.getElementById('profileRole');
      const profileLocEl = document.getElementById('profileLoc');
      const profileInstagramLinkEl = document.getElementById('profileInstagramLink');
      const profileXLinkEl = document.getElementById('profileXLink');
      if(profileNameEl){
        profileNameEl.textContent = ABOUT.name || 'kuugaze';
        profileNameEl.style.display = (ABOUT.showName === false) ? 'none' : '';
      }
      if(profileRoleEl){
        profileRoleEl.textContent = ABOUT.role || 'Digital Artist based in Tokyo, Japan';
        profileRoleEl.style.display = (ABOUT.showRole === false) ? 'none' : '';
      }
      if(profileLocEl){
        profileLocEl.textContent = ABOUT.loc || '3DCG, VR, AudioVisual';
        profileLocEl.style.display = (ABOUT.showRole === false) ? 'none' : '';
      }
      if(profileInstagramLinkEl){
        profileInstagramLinkEl.href = ABOUT.instagramUrl || 'https://instagram.com/kuugaze';
        profileInstagramLinkEl.style.display = (ABOUT.showInstagram === false) ? 'none' : '';
      }
      if(profileXLinkEl){
        if(ABOUT.showX === true && ABOUT.xUrl){
          profileXLinkEl.href = ABOUT.xUrl;
          profileXLinkEl.style.display = '';
        }else{
          profileXLinkEl.style.display = 'none';
        }
      }
      const aboutCardThumb = document.querySelector('.about-card .thumb');
      if(aboutCardThumb && ABOUT.thumb){
        aboutCardThumb.innerHTML = `<img src="${resolveImgSrc(ABOUT.thumb)}" alt="" loading="lazy">`;
      }
      document.documentElement.style.setProperty('--banner-height', (ABOUT.bannerHeight || 190) + 'px');
      document.documentElement.style.setProperty('--site-width', (ABOUT.siteWidth || 1240) + 'px');
      // Desktop-only gallery column count/gap (mobile keeps its own fixed
      // layout via the max-width media queries, which don't read these vars).
      document.documentElement.style.setProperty('--grid-columns', String(ABOUT.gridColumns || 4));
      document.documentElement.style.setProperty('--grid-gap-x', (ABOUT.gridGapX ?? 16) + 'px');
      document.documentElement.style.setProperty('--grid-gap-y', (ABOUT.gridGapY ?? 20) + 'px');
      // Hiding captions shrinks every card down to just its thumbnail, so
      // the row-gap above becomes the only vertical space between rows --
      // no separate "fill the gap" logic needed.
      document.documentElement.classList.toggle('hide-captions', ABOUT.showCaptions === false);
      applyThemeStyleVars(ABOUT);
      const adminVerified = isAdmin ? await verifyAdminAccess() : false;
      if(adminVerified){
        // The public works.json above never contains hidden works -- fetch
        // the full data (including hidden works) from the Worker instead,
        // now that the secret has been verified.
        try{
          const secret = localStorage.getItem(ADMIN_SECRET_KEY);
          const full = await fetchFullDataFromWorker(secret);
          if(full && Array.isArray(full.works)) works = full.works;
          // Hidden works' image files are private too -- fetch them into
          // blob: URLs before rendering so their thumbnails/galleries show
          // up in the admin panel despite never having a public URL.
          await preloadHiddenImages(works, secret);
        }catch(e){
          console.error('Failed to load full admin data', e);
        }
      }
      WORKS = works;
      WORKS_BY_KEY = Object.fromEntries(works.map(w => [w.key, w]));
      const visibleWorks = adminVerified ? works : works.filter(w => !w.hidden);
      grid.insertAdjacentHTML('beforeend', visibleWorks.map(w => cardHtml(w, adminVerified)).join(''));
      if(adminVerified){
        enableDragReorder();
        enableHideToggle();
        enableEditButtons();
        enableAboutEditButton();
        buildAdminPanel();
        openSiteSettingsPanel();
      }
    })
    .catch(err => {
      console.error('Failed to load works.json', err);
    });
</script>
</body>
</html>
