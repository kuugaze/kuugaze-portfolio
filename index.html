<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuugaze</title>
<style>
  :root{
    --bg:#f4f4f2;
    --card-bg:#ffffff;
    --ink:#1a1a1a;
    --sub:#6b6b6b;
    --line:#e2e2df;
    --accent:#2b3fff;
    --modal-sub:var(--sub);
    --modal-line:var(--line);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141416;
      --card-bg:#1d1d20;
      --ink:#f2f2f0;
      --sub:#9c9c9c;
      --line:#2c2c2f;
      --accent:#7c8aff;
      --modal-sub:#eaeaea;
      --modal-line:rgba(255,255,255,.3);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141416;
    --card-bg:#1d1d20;
    --ink:#f2f2f0;
    --sub:#9c9c9c;
    --line:#2c2c2f;
    --accent:#7c8aff;
    --modal-sub:#eaeaea;
    --modal-line:rgba(255,255,255,.3);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:Arial,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  }
  a{color:inherit;text-decoration:none;}

  .banner{
    width:100%;
    height:190px;
    background-image:url("images/banner.png");
    background-size:cover;
    background-position:center;
  }

  .wrap{
    max-width:1240px;
    margin:0 auto;
    padding:28px 28px 80px;
  }

  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:40px;
    align-items:start;
  }

  .profile{
    padding-top:0;
    position:sticky;
    top:24px;
  }
  .avatar{
    width:104px;
    height:104px;
    border-radius:50%;
    object-fit:cover;
    margin-top:-52px;
    border:4px solid var(--bg);
    display:block;
    background:var(--card-bg);
  }
  .profile h1{
    font-size:20px;
    margin:14px 0 4px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .profile .role{
    font-size:13px;
    color:var(--sub);
    margin:0 0 6px;
    line-height:1.5;
  }
  .profile .loc{
    font-size:12px;
    color:var(--sub);
    margin:0 0 16px;
  }
  .socials{
    display:flex;
    flex-direction:column;
    gap:8px;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  .socials a{
    font-size:12px;
    color:var(--sub);
    display:flex;
    align-items:center;
    gap:6px;
    transition:color .15s ease;
  }
  .socials a:hover{ color:var(--accent); }
  .socials svg{ width:14px; height:14px; fill:currentColor; }

  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px 16px;
  }
  .card{
    display:block;
    cursor:pointer;
  }
  .thumb{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    background:var(--card-bg);
    border:1px solid var(--line);
  }
  .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform .35s ease, opacity .35s ease;
  }
  .card:hover .thumb img{
    transform:scale(1.04);
    opacity:.92;
  }
  .caption{
    margin-top:9px;
    line-height:1.45;
  }
  .cap-label{
    display:block;
    font-size:11px;
    font-weight:500;
    color:var(--sub);
    letter-spacing:.02em;
    margin-bottom:2px;
  }
  .cap-title{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }

  .about-card .thumb{
    display:flex;
    align-items:center;
    justify-content:center;
    border:1.5px solid var(--accent);
    background:var(--card-bg);
  }
  .about-card .thumb span{
    font-style:italic;
    font-size:19px;
    color:var(--accent);
  }
  .about-card .caption{ visibility:hidden; }

  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
    .profile{ position:static; }
    .avatar{ margin-top:-40px; }
    .grid{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:420px){
    .grid{ grid-template-columns:repeat(2,1fr); gap:14px 10px; }
    .wrap{ padding:0 16px 60px; }
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:flex; justify-content:center;
    padding:56px 20px;
    overflow-y:auto;
    z-index:50;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--card-bg);
    color:var(--ink);
    max-width:720px;
    width:100%;
    height:fit-content;
    border-radius:8px;
    padding:40px 44px 48px;
    position:relative;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .proj-subtitle{
    font-style:italic;
    font-weight:700;
    color:var(--accent);
    font-size:22px;
    line-height:1.4;
    margin:0 0 18px;
    text-wrap:balance;
  }
  .proj-heading2{
    font-style:italic;
    font-weight:700;
    color:var(--accent);
    font-size:16px;
    margin:26px 0 12px;
  }
  .proj-text{
    font-size:13px;
    line-height:1.9;
    color:var(--ink);
    white-space:pre-wrap;
    margin:0 0 6px;
  }
  .proj-text strong{ font-weight:700; }
  .proj-text a{ color:var(--accent); text-decoration:underline; word-break:break-all; }
  .proj-divider{
    border:none;
    border-top:1px dashed var(--modal-line);
    margin:20px 0;
  }
  .proj-meta{
    font-size:12px;
    line-height:1.9;
    color:var(--modal-sub);
    white-space:pre-wrap;
    margin:0 0 6px;
  }
  .proj-note{
    font-size:11.5px;
    line-height:1.8;
    color:var(--modal-sub);
    white-space:pre-wrap;
    margin:18px 0 0;
  }
  .proj-embed{
    position:relative;
    display:block;
    width:100%;
    aspect-ratio:16/9;
    margin:22px 0 0;
    border-radius:4px;
    overflow:hidden;
    background:#000;
  }
  .proj-embed iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0;
  }
  .proj-gallery{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin:22px 0 0;
  }
  .proj-gallery img{
    width:100%;
    display:block;
    border-radius:2px;
  }
  @media (max-width:600px){
    .modal-overlay{ padding:48px 32px; }
    .modal{ padding:30px 20px 36px; }
    .proj-subtitle{ font-size:19px; }
    .proj-gallery{ grid-template-columns:1fr; }
  }

  .admin-mode .card:not(.about-card){
    cursor:grab;
  }
  .admin-mode .card:not(.about-card):active{
    cursor:grabbing;
  }
  .card.dragging{
    opacity:.35;
  }
  .card.drag-over{
    outline:2px dashed var(--accent);
    outline-offset:4px;
    border-radius:4px;
  }
  #adminPanel{
    position:fixed;
    right:16px; bottom:16px;
    z-index:200;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
    box-shadow:0 12px 32px rgba(0,0,0,.3);
    width:250px;
    max-height:calc(100vh - 32px);
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    font-size:12px;
    color:var(--ink);
  }
  #adminPanel .admin-title{
    font-weight:700;
    font-size:13px;
  }
  #adminPanel .admin-desc{
    color:var(--sub);
    line-height:1.6;
  }
  #adminPanel .admin-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:4px 0;
  }
  #adminPanel input,
  #adminPanel textarea{
    font-size:12px;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    width:100%;
    font-family:inherit;
  }
  #adminPanel textarea{ resize:vertical; }
  #adminPanel button{
    font-size:12px;
    font-weight:700;
    padding:8px 9px;
    border:none;
    border-radius:5px;
    background:var(--accent);
    color:#fff;
    cursor:pointer;
  }
  #adminPanel button:disabled{
    opacity:.5;
    cursor:default;
  }
  #adminStatus, #adminAddStatus{
    color:var(--sub);
    min-height:14px;
    line-height:1.5;
  }
  .hide-toggle-btn{
    position:absolute;
    top:6px; right:6px;
    z-index:5;
    font-size:10px;
    padding:4px 7px;
    border:none;
    border-radius:4px;
    background:rgba(0,0,0,.65);
    color:#fff;
    cursor:pointer;
  }
  .edit-toggle-btn{
    position:absolute;
    top:6px; left:6px;
    z-index:5;
    font-size:10px;
    padding:4px 7px;
    border:none;
    border-radius:4px;
    background:rgba(0,0,0,.65);
    color:#fff;
    cursor:pointer;
  }
  .card.is-hidden .thumb img{
    opacity:.35;
  }
  .hidden-badge{
    display:inline-block;
    margin-left:6px;
    font-size:10px;
    font-weight:700;
    color:#fff;
    background:#b33;
    padding:1px 6px;
    border-radius:3px;
    vertical-align:middle;
  }

  #workEditorOverlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.6);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 20px;
    overflow-y:auto;
    z-index:300;
  }
  #workEditorOverlay[hidden]{ display:none; }
  .work-editor{
    background:var(--card-bg);
    color:var(--ink);
    max-width:560px;
    width:100%;
    border-radius:8px;
    padding:28px 28px 32px;
    box-shadow:0 24px 70px rgba(0,0,0,.45);
  }
  .work-editor h2{
    font-size:16px;
    margin:0 0 16px;
  }
  .we-field{ margin-bottom:14px; }
  .we-field label{
    display:block;
    font-size:11px;
    font-weight:700;
    color:var(--sub);
    margin-bottom:4px;
  }
  .we-field input[type="text"],
  .we-field textarea{
    width:100%;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--bg);
    color:var(--ink);
    font-family:inherit;
  }
  .we-field textarea{ resize:vertical; }
  .we-thumb-preview{
    width:120px; height:120px;
    width:120px; height:120px;
    border-radius:4px;
    object-fit:cover;
    border:1px solid var(--line);
    background:var(--bg);
    display:block;
    margin-bottom:8px;
  }
  .we-gallery-list{
    display:flex; flex-wrap:wrap; gap:8px;
    margin-bottom:8px;
  }
  .we-gallery-item{
    position:relative;
    width:64px; height:64px;
  }
  .we-gallery-item img{
    width:100%; height:100%;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
    display:block;
  }
  .we-gallery-item button{
    position:absolute; top:-6px; right:-6px;
    width:18px; height:18px;
    border-radius:50%;
    border:none;
    background:#b33;
    color:#fff;
    font-size:11px;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .we-actions{
    display:flex; gap:8px;
    margin-top:16px;
  }
  .we-actions button{
    font-size:12px;
    font-weight:700;
    padding:9px 14px;
    border:none;
    border-radius:5px;
    cursor:pointer;
  }
  .we-save-btn{ background:var(--accent); color:#fff; }
  .we-cancel-btn{ background:var(--line); color:var(--ink); }
  #weStatus{
    margin-top:10px;
    font-size:12px;
    color:var(--sub);
    line-height:1.6;
    white-space:pre-wrap;
  }
</style>
</head>
<body>

<div class="banner"></div>

<div class="wrap">
  <div class="layout">

    <div class="profile">
      <img class="avatar" src="images/avatar.png" alt="kuugaze">
      <h1>kuugaze</h1>
      <p class="role">Digital Artist based in Tokyo, Japan</p>
      <p class="loc">3DCG, VR, AudioVisual</p>
      <div class="socials">
        <a href="https://instagram.com/kuugaze" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 0 1-1.38-.9 3.7 3.7 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.13 1.39A5.9 5.9 0 0 0 .62 4.14C.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.39 2.13a5.9 5.9 0 0 0 2.13 1.39c.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56a5.9 5.9 0 0 0 2.13-1.39 5.9 5.9 0 0 0 1.39-2.13c.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.9 5.9 0 0 0-1.39-2.13A5.9 5.9 0 0 0 19.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0z"/><path d="M12 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4zm6.41-10.4a1.44 1.44 0 1 1-1.44-1.44 1.44 1.44 0 0 1 1.44 1.44z"/></svg>
          Instagram
        </a>
      </div>
    </div>

    <div class="grid" id="grid">
      <div class="card about-card" data-modal="about">
        <div class="thumb"><span>about</span></div>
        <div class="caption">about</div>
      </div>
      <!-- work cards are rendered here by script.js from works.json -->
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const GH_REPO = 'kuugaze/kuugaze-portfolio';
  let ABOUT = { subtitle: 'about', jp: '', meta: '' };

  let WORKS = [];
  let WORKS_BY_KEY = {};

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escapeAttr(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmt(text){
    if(!text) return '';
    let esc = escapeHtml(text);
    esc = esc.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    esc = esc.replace(/^■.*$/gm, '<strong>$&</strong>');
    return esc;
  }
  function cardHtml(work, isAdminCard){
    const hiddenClass = (isAdminCard && work.hidden) ? ' is-hidden' : '';
    const toggleBtn = isAdminCard
      ? `<button type="button" class="hide-toggle-btn" data-key="${work.key}">${work.hidden ? '表示する' : '非公開にする'}</button>`
      : '';
    const editBtn = isAdminCard
      ? `<button type="button" class="edit-toggle-btn" data-key="${work.key}">編集</button>`
      : '';
    const hiddenBadge = (isAdminCard && work.hidden) ? '<span class="hidden-badge">非公開</span>' : '';
    return `<div class="card${hiddenClass}" data-modal="${work.key}">`
      + `<div class="thumb">${editBtn}${toggleBtn}<img src="${work.thumb}" alt="" loading="lazy"></div>`
      + `<div class="caption"><span class="cap-label">${escapeHtml(work.category || '')}</span><span class="cap-title">${escapeHtml(work.title || '')}</span>${hiddenBadge}</div>`
      + `</div>`;
  }
  function embedHtml(work){
    if(!work.embed) return '';
    const src = work.embed.type === 'youtube'
      ? `https://www.youtube.com/embed/${work.embed.id}`
      : `https://player.vimeo.com/video/${work.embed.id}${work.embed.h ? '?h='+work.embed.h : ''}`;
    return `<div class="proj-embed"><iframe src="${src}" title="video" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  }
  function galleryHtml(images){
    if(!images || !images.length) return '';
    return `<div class="proj-gallery">${images.map(src=>`<img src="${src}" alt="" loading="lazy">`).join('')}</div>`;
  }
  function renderProject(d){
    let html = `<div class="proj-subtitle">${escapeHtml(d.subtitle)}</div>`;
    if(d.jp) html += `<div class="proj-text">${fmt(d.jp)}</div>`;
    if(d.jp && d.en) html += `<hr class="proj-divider">`;
    if(d.en) html += `<div class="proj-text">${fmt(d.en)}</div>`;
    if(d.heading2) html += `<div class="proj-heading2">${escapeHtml(d.heading2)}</div>`;
    if(d.meta) html += `<div class="proj-meta">${fmt(d.meta)}</div>`;
    if(d.note) html += `<div class="proj-note">${fmt(d.note)}</div>`;
    if(d.embed) html += embedHtml(d);
    if(d.images) html += galleryHtml(d.images);
    return html;
  }

  const overlay = document.getElementById('modalOverlay');
  const body = document.getElementById('modalBody');
  const grid = document.getElementById('grid');

  function closeModal(){
    overlay.hidden = true;
    body.innerHTML = '';
  }
  function openModal(key){
    const d = key === 'about' ? ABOUT : WORKS_BY_KEY[key];
    if(!d) return;
    body.innerHTML = renderProject(d);
    overlay.hidden = false;
    overlay.scrollTop = 0;
  }
  grid.addEventListener('click', (e)=>{
    const card = e.target.closest('[data-modal]');
    if(!card) return;
    openModal(card.dataset.modal);
  });
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && !overlay.hidden) closeModal(); });

  // --- Admin mode: drag-to-reorder (owner only) ---
  const ADMIN_KEY = 'kuugazeadmin';
  const isAdmin = new URLSearchParams(location.search).get(ADMIN_KEY) === '1';

  function getDragAfterElement(container, x, y, dragEl){
    const els = [...container.querySelectorAll('.card:not(.about-card)')].filter(el => el !== dragEl);
    let closest = { el: null, dist: Infinity };
    els.forEach(el => {
      const box = el.getBoundingClientRect();
      const cx = box.left + box.width / 2;
      const cy = box.top + box.height / 2;
      const dist = Math.hypot(x - cx, y - cy);
      if(dist < closest.dist) closest = { el, dist, box, cx };
    });
    if(!closest.el) return null;
    return (x > closest.cx) ? closest.el.nextElementSibling : closest.el;
  }

  function syncWorksOrderFromDom(){
    const keys = [...grid.querySelectorAll('.card[data-modal]')]
      .map(c => c.dataset.modal)
      .filter(k => k !== 'about');
    WORKS = keys.map(k => WORKS_BY_KEY[k]).filter(Boolean);
  }

  function enableDragReorder(){
    document.body.classList.add('admin-mode');
    let dragEl = null;
    grid.querySelectorAll('.card:not(.about-card)').forEach(card => {
      card.draggable = true;
      card.addEventListener('dragstart', () => {
        dragEl = card;
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        dragEl = null;
        syncWorksOrderFromDom();
      });
      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        if(!dragEl) return;
        const after = getDragAfterElement(grid, e.clientX, e.clientY, dragEl);
        if(after == null) grid.appendChild(dragEl);
        else grid.insertBefore(dragEl, after);
      });
    });
  }

  function enableHideToggle(){
    grid.querySelectorAll('.hide-toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const key = btn.dataset.key;
        const w = WORKS_BY_KEY[key];
        if(!w) return;
        w.hidden = !w.hidden;
        const card = btn.closest('.card');
        card.classList.toggle('is-hidden', !!w.hidden);
        btn.textContent = w.hidden ? '表示する' : '非公開にする';
        const caption = card.querySelector('.caption');
        const existingBadge = caption.querySelector('.hidden-badge');
        if(w.hidden && !existingBadge){
          const badge = document.createElement('span');
          badge.className = 'hidden-badge';
          badge.textContent = '非公開';
          caption.appendChild(badge);
        }else if(!w.hidden && existingBadge){
          existingBadge.remove();
        }
      });
    });
  }

  function enableEditButtons(){
    grid.querySelectorAll('.edit-toggle-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        e.preventDefault();
        const key = btn.dataset.key;
        openWorkEditor(WORKS_BY_KEY[key] || null);
      });
    });
  }

  function parseEmbedUrl(url){
    if(!url) return null;
    url = url.trim();
    if(!url) return null;
    let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]v=([a-zA-Z0-9_-]+)/) || url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]+)/);
    if(m) return { type: 'youtube', id: m[1] };
    m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-zA-Z0-9]+))?/);
    if(m){
      const embed = { type: 'vimeo', id: m[1] };
      if(m[2]) embed.h = m[2];
      return embed;
    }
    return null;
  }
  function embedToUrl(embed){
    if(!embed) return '';
    if(embed.type === 'youtube') return `https://youtu.be/${embed.id}`;
    if(embed.type === 'vimeo') return `https://vimeo.com/${embed.id}${embed.h ? '/'+embed.h : ''}`;
    return '';
  }

  // --- Publish via GitHub Issue: builds the payload/body, copies it to the
  // clipboard as a fallback, and opens a pre-filled "new issue" page. A
  // GitHub Action (triggered by the "site-update" label) reads the issue
  // and updates the site automatically — no token or API call ever runs
  // from this page. ---
  function buildSiteUpdateBody(payload, imageSlots){
    let body = 'SITE-UPDATE-PAYLOAD-START\n```json\n' + JSON.stringify(payload, null, 2) + '\n```\nSITE-UPDATE-PAYLOAD-END\n';
    if(imageSlots && imageSlots.length){
      body += '\n---\n### 画像をアップロードしてください\n下記の見出しのすぐ下に、対応する画像をドラッグ&ドロップ（またはペースト）してください。\n';
      imageSlots.forEach(slot => {
        body += `\n#### IMG:${slot.token} (${slot.label})\n\n`;
      });
    }
    return body;
  }
  async function publishSiteUpdate(payload, imageSlots, titleText, statusEl){ const body = buildSiteUpdateBody(payload, imageSlots); const encodedBody = encodeURIComponent(body); const base = `https://github.com/${GH_REPO}/issues/new?title=${encodeURIComponent(titleText)}&labels=site-update`; const SAFE_URL_BODY_LIMIT = 6000; if(encodedBody.length <= SAFE_URL_BODY_LIMIT){ window.open(`${base}&body=${encodedBody}`, '_blank'); if(statusEl){ statusEl.textContent = imageSlots && imageSlots.length ? '開いたGitHubのページで、指定された場所に画像をドラッグ&ドロップしてから「Submit new issue」を押してください。数分でサイトに反映されます。' : '開いたGitHubのページで「Submit new issue」を押してください。数分でサイトに反映されます。'; } return; } const w = window.open('about:blank', '_blank'); let copied = false; try{ await navigator.clipboard.writeText(body); copied = true; }catch(err){ } if(w) w.location.href = base; else window.open(base, '_blank'); if(statusEl){ if(copied){ statusEl.textContent = imageSlots && imageSlots.length ? '開いたGitHubのページの本文欄に貼り付け（Ctrl+V / Cmd+V）し、指定された場所に画像をドラッグ&ドロップしてから「Submit new issue」を押してください。数分でサイトに反映されます。' : '開いたGitHubのページの本文欄に貼り付け（Ctrl+V / Cmd+V）して「Submit new issue」を押してください。数分でサイトに反映されます。'; }else{ statusEl.textContent = 'クリップボードへのコピーに失敗しました。以下の内容を手動でコピーして、開いたGitHubのページの本文欄に貼り付けてください：\n\n' + body; } } }

  let weState = null;

  function openWorkEditor(work, opts){
    opts = opts || {};
    const isAbout = !!opts.isAbout;
    const existing = document.getElementById('workEditorOverlay');
    if(existing) existing.remove();

    const isNew = !isAbout && !work;
    weState = {
      key: isAbout ? null : (isNew ? null : work.key),
      pendingThumbFile: null,
      remainingImages: (!isAbout && !isNew && work.images) ? [...work.images] : [],
      pendingGalleryFiles: []
    };

    const thumbFieldHtml = isAbout ? '' : `
        <div class="we-field">
          <label>サムネイル</label>
          <img class="we-thumb-preview" id="weThumbPreview" src="${isNew ? '' : escapeAttr(work.thumb)}" ${isNew ? 'style="display:none"' : ''}>
          <input type="file" id="weThumbFile" accept="image/*">
        </div>`;
    const categoryTitleHtml = isAbout ? '' : `
        <div class="we-field"><label>カテゴリ</label><input type="text" id="weCategory" value="${isNew ? '' : escapeAttr(work.category || '')}"></div>
        <div class="we-field"><label>タイトル（必須）</label><input type="text" id="weTitle" value="${isNew ? '' : escapeAttr(work.title || '')}"></div>`;
    const enNoteEmbedGalleryHtml = isAbout ? '' : `
        <div class="we-field"><label>本文（英語・任意）</label><textarea id="weEn" rows="4">${isNew ? '' : escapeHtml(work.en || '')}</textarea></div>
        <div class="we-field"><label>備考（任意）</label><textarea id="weNote" rows="3">${isNew ? '' : escapeHtml(work.note || '')}</textarea></div>
        <div class="we-field"><label>動画URL（YouTube / Vimeo・任意）</label><input type="text" id="weEmbed" value="${isNew ? '' : escapeAttr(embedToUrl(work.embed))}" placeholder="https://youtu.be/..."></div>
        <div class="we-field">
          <label>ギャラリー画像</label>
          <div class="we-gallery-list" id="weGalleryList"></div>
          <input type="file" id="weGalleryFile" accept="image/*" multiple>
        </div>`;
    const subtitleValue = isAbout ? escapeAttr(ABOUT.subtitle || '') : (isNew ? '' : escapeAttr(work.subtitle || ''));
    const jpValue = isAbout ? escapeHtml(ABOUT.jp || '') : (isNew ? '' : escapeHtml(work.jp || ''));
    const metaValue = isAbout ? escapeHtml(ABOUT.meta || '') : (isNew ? '' : escapeHtml(work.meta || ''));

    const overlay = document.createElement('div');
    overlay.id = 'workEditorOverlay';
    overlay.innerHTML = `
      <div class="work-editor">
        <h2>${isAbout ? 'Aboutを編集' : (isNew ? '新しい作品を追加' : '作品を編集')}</h2>
        ${thumbFieldHtml}
        ${categoryTitleHtml}
        <div class="we-field"><label>サブタイトル</label><input type="text" id="weSubtitle" value="${subtitleValue}"></div>
        <div class="we-field"><label>本文（日本語）</label><textarea id="weJp" rows="5">${jpValue}</textarea></div>
        <div class="we-field"><label>メタ情報（任意）</label><textarea id="weMeta" rows="3">${metaValue}</textarea></div>
        ${enNoteEmbedGalleryHtml}
        <div class="we-actions">
          <button type="button" class="we-save-btn" id="weCopyBtn">GitHubで公開する</button>
          <button type="button" class="we-cancel-btn" id="weCancelBtn">閉じる</button>
        </div>
        <div id="weStatus"></div>
      </div>
    `;
    document.body.appendChild(overlay);

    function renderGalleryList(){
      const list = overlay.querySelector('#weGalleryList');
      if(!list) return;
      let html = '';
      weState.remainingImages.forEach((url, i) => {
        html += `<div class="we-gallery-item"><img src="${escapeAttr(url)}" alt=""><button type="button" data-kind="existing" data-idx="${i}">×</button></div>`;
      });
      weState.pendingGalleryFiles.forEach((f, i) => {
        html += `<div class="we-gallery-item"><img src="${URL.createObjectURL(f)}" alt=""><button type="button" data-kind="pending" data-idx="${i}">×</button></div>`;
      });
      list.innerHTML = html;
      list.querySelectorAll('button').forEach(b => {
        b.addEventListener('click', () => {
          const idx = parseInt(b.dataset.idx, 10);
          if(b.dataset.kind === 'existing') weState.remainingImages.splice(idx, 1);
          else weState.pendingGalleryFiles.splice(idx, 1);
          renderGalleryList();
        });
      });
    }
    if(!isAbout) renderGalleryList();

    if(!isAbout){
      const thumbFileInput = overlay.querySelector('#weThumbFile');
      const thumbPreview = overlay.querySelector('#weThumbPreview');
      thumbFileInput.addEventListener('change', () => {
        const f = thumbFileInput.files[0];
        if(!f) return;
        weState.pendingThumbFile = f;
        thumbPreview.src = URL.createObjectURL(f);
        thumbPreview.style.display = 'block';
      });

      const galleryFileInput = overlay.querySelector('#weGalleryFile');
      galleryFileInput.addEventListener('change', () => {
        weState.pendingGalleryFiles.push(...Array.from(galleryFileInput.files));
        galleryFileInput.value = '';
        renderGalleryList();
      });
    }

    overlay.querySelector('#weCancelBtn').addEventListener('click', () => {
      overlay.remove();
      weState = null;
    });

    overlay.querySelector('#weCopyBtn').addEventListener('click', async () => {
      const status = overlay.querySelector('#weStatus');

      if(isAbout){
        const payload = {
          type: 'about',
          subtitle: overlay.querySelector('#weSubtitle').value.trim(),
          jp: overlay.querySelector('#weJp').value.trim(),
          meta: overlay.querySelector('#weMeta').value.trim()
        };
        status.textContent = 'GitHubのページを開いています…';
        await publishSiteUpdate(payload, [], '[site-update] about', status);
        return;
      }

      const title = overlay.querySelector('#weTitle').value.trim();
      if(!title){ status.textContent = 'タイトルを入力してください'; return; }
      const embed = parseEmbedUrl(overlay.querySelector('#weEmbed').value);
      const imageSlots = [];
      if(weState.pendingThumbFile) imageSlots.push({ token: 'THUMB', label: 'サムネイル' });
      weState.pendingGalleryFiles.forEach((f, i) => {
        imageSlots.push({ token: `GAL${i + 1}`, label: `ギャラリー画像 ${i + 1}` });
      });
      const payload = {
        type: 'work',
        key: weState.key,
        original: (!isNew && work) ? work : null,
        category: overlay.querySelector('#weCategory').value.trim(),
        title,
        subtitle: overlay.querySelector('#weSubtitle').value.trim(),
        jp: overlay.querySelector('#weJp').value.trim(),
        en: overlay.querySelector('#weEn').value.trim(),
        meta: overlay.querySelector('#weMeta').value.trim(),
        note: overlay.querySelector('#weNote').value.trim(),
        embed,
        existingImages: weState.remainingImages,
        currentThumb: (!isNew && work) ? work.thumb : null,
        newThumbnail: weState.pendingThumbFile ? 'THUMB' : null,
        newGalleryImages: weState.pendingGalleryFiles.map((f, i) => `GAL${i + 1}`)
      };
      const issueTitle = isNew ? `[site-update] work-new: ${title}` : `[site-update] work-edit: ${weState.key}`;
      status.textContent = 'GitHubのページを開いています…';
      await publishSiteUpdate(payload, imageSlots, issueTitle, status);
    });
  }

  function buildAdminPanel(){
    const panel = document.createElement('div');
    panel.id = 'adminPanel';
    panel.innerHTML = `
      <div class="admin-title">管理者モード</div>
      <div class="admin-desc">カードをドラッグして並び替え、左上の「編集」でサムネ・キャプション・画像・動画を変更、右上のボタンで公開・非公開を切り替えられます。変更したらボタンを押すとGitHubのページが開くので、そのまま送信すれば自動でサイトに反映されます。</div>
      <button id="adminCopyBtn">並び替え・公開状態を公開する</button>
      <div id="adminStatus"></div>
      <hr class="admin-divider">
      <button id="adminAddNewBtn">＋ 新しい作品を追加</button>
    `;
    document.body.appendChild(panel);

    const copyBtn = panel.querySelector('#adminCopyBtn');
    const status = panel.querySelector('#adminStatus');
    copyBtn.addEventListener('click', async () => {
      syncWorksOrderFromDom();
      const order = WORKS.map(w => w.key);
      const hidden = WORKS.filter(w => w.hidden).map(w => w.key);
      const payload = { type: 'reorder', order, hidden };
      status.textContent = 'GitHubのページを開いています…';
      await publishSiteUpdate(payload, [], '[site-update] reorder', status);
    });

    panel.querySelector('#adminAddNewBtn').addEventListener('click', () => {
      openWorkEditor(null);
    });
  }

  function enableAboutEditButton(){
    const aboutThumb = document.querySelector('.about-card .thumb');
    if(!aboutThumb) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'edit-toggle-btn';
    btn.textContent = '編集';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      openWorkEditor(null, { isAbout: true });
    });
    aboutThumb.insertBefore(btn, aboutThumb.firstChild);
  }

  Promise.all([
    fetch('works.json').then(r => r.json()),
    fetch('about.json').then(r => r.ok ? r.json() : null).catch(() => null)
  ])
    .then(([works, about]) => {
      WORKS = works;
      WORKS_BY_KEY = Object.fromEntries(works.map(w => [w.key, w]));
      if(about) ABOUT = about;
      const visibleWorks = isAdmin ? works : works.filter(w => !w.hidden);
      grid.insertAdjacentHTML('beforeend', visibleWorks.map(w => cardHtml(w, isAdmin)).join(''));
      if(isAdmin){
        enableDragReorder();
        enableHideToggle();
        enableEditButtons();
        enableAboutEditButton();
        buildAdminPanel();
      }
    })
    .catch(err => {
      console.error('Failed to load works.json', err);
    });
</script>
</body>
</html>
